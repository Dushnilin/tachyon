name: Frontend CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'fe-app-tachyon/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-checks:
    name: Frontend Quality Checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe-app-tachyon

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe-app-tachyon/package-lock.json

      # The project uses npm (package-lock.json); yarn.lock does not exist, so
      # a yarn install here would resolve fresh versions on every run.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        id: format
        run: |
          npm run format
          if ! git diff --exit-code; then
            echo "::error::Code is not formatted. Run 'npm run format' locally."
            exit 1
          fi

      - name: Run linter
        run: npm run lint -- --max-warnings=0

      - name: Run tests
        run: npm test -- --run

      - name: Build project
        id: build
        run: |
          npm run build
          if ! git diff --exit-code -- ../luci-app-tachyon/htdocs; then
            echo "::error::Build generated changes. Check build output."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Frontend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Format check: ${{ steps.format.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint check: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build: ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "![Success](https://cdn2.combot.org/boratbrat/webp/6xf09f988f.webp)" >> $GITHUB_STEP_SUMMARY
