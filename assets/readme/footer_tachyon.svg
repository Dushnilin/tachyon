<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="heart-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="100">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes heartBeating {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.3); }
      50% { transform: scale(1.1); }
      70% { transform: scale(1.35); }
    }
    @keyframes streamFlowFooter {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }

    .heart-icon { transform-origin: 600px 58px; animation: heartBeating 1.6s ease-in-out infinite; }
    .footer-wire { stroke-dasharray: 10 30; animation: streamFlowFooter 2.5s linear infinite; }

    .foot-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #94A3B8; }
    .foot-brand { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 15px; fill: #F8FAFC; letter-spacing: 0.5px; }
  </style>

  <!-- Top Cyber Laser Line -->
  <line x1="100" y1="12" x2="1100" y2="12" stroke="url(#footer-grad)" stroke-width="1.5"/>
  <line x1="200" y1="12" x2="1000" y2="12" stroke="#00F0FF" stroke-width="2" class="footer-wire"/>

  <!-- Footer Content -->
  <g transform="translate(600, 58)" text-anchor="middle">
    <!-- Heart Symbol -->
    <text x="-135" y="5" font-size="18" fill="#EF4444" class="heart-icon" filter="url(#heart-glow)">❤️</text>
    <text x="0" y="5" class="foot-text">Crafted with passion for the global <tspan class="foot-brand" fill="#00F0FF">OpenWrt</tspan> &amp; <tspan class="foot-brand" fill="#C084FC">Tachyon</tspan> Community</text>
  </g>
</svg>
