<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="176" viewBox="0 0 1200 176"
     role="img" aria-labelledby="title desc">
  <title id="title">Watchdog, контроль процессов и защита флеш-памяти</title>
  <desc id="desc">Проверка подлинности процессов по pid, starttime и boot_id, потоковые резервные копии и откат LKG, контроль SMP-нагрузки и защита NAND флеш-памяти через write_file_if_changed.</desc>

  <rect width="1200" height="176" rx="16" fill="#141415"/>
  <rect x="0.5" y="0.5" width="1199" height="175" rx="15.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <!-- Header -->
  <text x="24" y="34" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="500">Watchdog, верификация процессов и защита флеш-памяти</text>
  <text x="1176" y="34" text-anchor="end" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">core_mgr.rs · transaction.rs · snapshots.rs</text>

  <!-- Card 1 (Highlighted): PID Provenance (280px) -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="280" height="104" rx="12" fill="#19191b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="16" y="26" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">PID Provenance &amp; Identity</text>
    <text x="16" y="50" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="500">Защита от чужих PID</text>
    <text x="16" y="72" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Сверка pid, starttime и boot_id</text>
    <text x="16" y="90" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">остановка строго по пути бинарника</text>
  </g>

  <!-- Card 2: Binary Backups & LKG (280px) -->
  <g transform="translate(316, 52)">
    <rect x="0" y="0" width="280" height="104" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="26" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">LKG &amp; Binary Backup</text>
    <text x="16" y="50" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="500">Откат бинарников и конфига</text>
    <text x="16" y="72" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Потоковый SHA-256 бэкап ядра</text>
    <text x="16" y="90" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">и проверка конфига до применения</text>
  </g>

  <!-- Card 3: Loop & Memory Guard (280px) -->
  <g transform="translate(608, 52)">
    <rect x="0" y="0" width="280" height="104" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="26" fill="#4cc38a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">SMP Guard · Memory Trim</text>
    <text x="16" y="50" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="500">Контроль циклов и ОЗУ</text>
    <text x="16" y="72" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Троттлинг опросов при высокой</text>
    <text x="16" y="90" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">нагрузке CPU и /tachyon/memory/trim</text>
  </g>

  <!-- Card 4: Flash Wear & Snapshots (276px) -->
  <g transform="translate(900, 52)">
    <rect x="0" y="0" width="276" height="104" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="26" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">write_file_if_changed() · tmpfs</text>
    <text x="16" y="50" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="500">Защита NAND и снапшоты</text>
    <text x="16" y="72" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Побайтовое сравнение перед записью</text>
    <text x="16" y="90" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">на флеш · кэш и DNS в /tmp</text>
  </g>
</svg>
