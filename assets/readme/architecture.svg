<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradients -->
    <radialGradient id="arch-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090D16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="card-bg-subtle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Track Gradients -->
    <linearGradient id="stream-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="stream-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="stream-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-p" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations for Packet Conduits */
    @keyframes flowTrackDirect {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flowTrackZapret {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flowTrackProxy {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    @keyframes routerPulse {
      0%, 100% { stroke: rgba(0, 240, 255, 0.4); }
      50% { stroke: rgba(0, 240, 255, 0.95); }
    }

    .wire-in { stroke-dasharray: 8 12; animation: flowTrackDirect 2s linear infinite; }
    .wire-direct { stroke-dasharray: 12 24; animation: flowTrackDirect 1.8s linear infinite; }
    .wire-zapret { stroke-dasharray: 12 24; animation: flowTrackZapret 2.2s linear infinite; }
    .wire-proxy { stroke-dasharray: 12 24; animation: flowTrackProxy 1.5s linear infinite; }

    .node-pulse { animation: nodeBlink 2.4s ease-in-out infinite; }
    .core-border { animation: routerPulse 3.5s ease-in-out infinite; }

    .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 20px; fill: #FFFFFF; }
    .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #94A3B8; }
    .text-node-h { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #F1F5F9; }
    .text-node-d { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: #94A3B8; }
    .text-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Surface Base -->
  <rect width="1200" height="500" rx="16" fill="url(#arch-bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Diagram Title Header -->
  <g transform="translate(50, 45)">
    <text class="text-title">⚡ TACHYON TRAFFIC ORCHESTRATION PIPELINE</text>
    <text y="24" class="text-sub">Интеллектуальная многопоточная селективная маршрутизация и десинхронизация пакетов</text>
  </g>

  <!-- ================================================================= -->
  <!-- CONNECTING CONDUIT WIRES (Animated Packet Flow) -->
  <!-- ================================================================= -->
  <g fill="none" stroke-linecap="round">
    <!-- Input Wire: Clients -> Router Core -->
    <path d="M 230,260 L 370,260" stroke="#334155" stroke-width="3"/>
    <path d="M 230,260 L 370,260" stroke="#38BDF8" stroke-width="3" class="wire-in" filter="url(#glow-p)"/>

    <!-- Path 1: Router -> Direct WAN (Green) -->
    <path d="M 610,210 C 680,210 700,130 770,130 L 930,130" stroke="#1E293B" stroke-width="3"/>
    <path d="M 610,210 C 680,210 700,130 770,130 L 930,130" stroke="#10B981" stroke-width="3" class="wire-direct" filter="url(#glow-p)"/>

    <!-- Path 2: Router -> Zapret2 DPI Bypass (Purple) -->
    <path d="M 610,260 L 930,260" stroke="#1E293B" stroke-width="3"/>
    <path d="M 610,260 L 930,260" stroke="#8B5CF6" stroke-width="3" class="wire-zapret" filter="url(#glow-p)"/>

    <!-- Path 3: Router -> sing-box VLESS / Proxy (Cyan) -->
    <path d="M 610,310 C 680,310 700,390 770,390 L 930,390" stroke="#1E293B" stroke-width="3"/>
    <path d="M 610,310 C 680,310 700,390 770,390 L 930,390" stroke="#00F0FF" stroke-width="3" class="wire-proxy" filter="url(#glow-p)"/>
  </g>

  <!-- ================================================================= -->
  <!-- NODE 1: CLIENT DEVICES (LAN / Wi-Fi) -->
  <!-- ================================================================= -->
  <g transform="translate(50, 155)">
    <rect width="180" height="210" rx="12" fill="url(#card-bg-subtle)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0369A1" fill-opacity="0.2"/>
    <text x="24" y="42" font-size="22">📱</text>
    <text x="65" y="38" class="text-node-h">LAN Clients</text>
    
    <!-- Client Devices List -->
    <g transform="translate(15, 70)">
      <rect width="150" height="34" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="22" class="text-node-d" fill="#E2E8F0">📺 Smart TV / Consoles</text>
    </g>
    <g transform="translate(15, 112)">
      <rect width="150" height="34" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="22" class="text-node-d" fill="#E2E8F0">💻 PCs &amp; MacBooks</text>
    </g>
    <g transform="translate(15, 154)">
      <rect width="150" height="34" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="22" class="text-node-d" fill="#E2E8F0">📱 Phones &amp; Tablets</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- NODE 2: TACHYON ROUTER CORE (OpenWrt Engine) -->
  <!-- ================================================================= -->
  <g transform="translate(370, 130)">
    <rect width="240" height="260" rx="14" fill="#0B132B" stroke="#00F0FF" stroke-width="2" class="core-border"/>
    
    <g transform="translate(20, 20)">
      <circle cx="20" cy="20" r="18" fill="#00F0FF" fill-opacity="0.15"/>
      <text x="10" y="28" font-size="20">⚡</text>
      <text x="48" y="20" class="text-node-h" fill="#00F0FF">Tachyon Core</text>
      <text x="48" y="34" class="text-node-d">OpenWrt ucode / nftables</text>
    </g>

    <!-- Sub-Engines Inside Core -->
    <g transform="translate(20, 75)">
      <!-- Module A: Smart Policy Splitter -->
      <rect width="200" height="42" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <circle cx="15" cy="21" r="4" fill="#10B981" class="node-pulse"/>
      <text x="28" y="20" class="text-node-h" font-size="12">Domain / IP Matcher</text>
      <text x="28" y="34" class="text-node-d" font-size="10">GeoIP + Hosts Engine</text>

      <!-- Module B: AI Doctor & Self-Healing -->
      <g transform="translate(0, 50)">
        <rect width="200" height="42" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
        <circle cx="15" cy="21" r="4" fill="#C084FC" class="node-pulse"/>
        <text x="28" y="20" class="text-node-h" font-size="12">AI Doctor &amp; Watchdog</text>
        <text x="28" y="34" class="text-node-d" font-size="10">Auto-Heal &amp; Quick Fix</text>
      </g>

      <!-- Module C: Dynamic Packet Routing -->
      <g transform="translate(0, 100)">
        <rect width="200" height="42" rx="6" fill="#111827" stroke="#1E293B" stroke-width="1"/>
        <circle cx="15" cy="21" r="4" fill="#00F0FF" class="node-pulse"/>
        <text x="28" y="20" class="text-node-h" font-size="12">nftables Flow Dispatcher</text>
        <text x="28" y="34" class="text-node-d" font-size="10">Zero-Copy Fast Path</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- NODE 3: THREE DIVERGENT DESTINATION PATHS -->
  <!-- ================================================================= -->
  
  <!-- PATH 1: DIRECT INTERNET (GREEN) -->
  <g transform="translate(930, 85)">
    <rect width="220" height="90" rx="10" fill="url(#card-bg-subtle)" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#10B981" fill-opacity="0.15"/>
    <text x="20" y="34" font-size="16">🌐</text>
    <text x="50" y="28" class="text-node-h" fill="#34D399">Direct WAN</text>
    <text x="50" y="42" class="text-badge" fill="#10B981">0 ms Overhead</text>
    <text x="16" y="68" class="text-node-d">Банки, Госуслуги, RuNet</text>
    <text x="16" y="82" class="text-node-d">Прямой маршрут без задержек</text>
  </g>

  <!-- PATH 2: LOCAL DPI DESYNC (PURPLE) -->
  <g transform="translate(930, 215)">
    <rect width="220" height="90" rx="10" fill="url(#card-bg-subtle)" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#8B5CF6" fill-opacity="0.15"/>
    <text x="20" y="34" font-size="16">🚀</text>
    <text x="50" y="28" class="text-node-h" fill="#C084FC">Zapret v2 / ByeDPI</text>
    <text x="50" y="42" class="text-badge" fill="#8B5CF6">Zero-VPS Desync</text>
    <text x="16" y="68" class="text-node-d">YouTube 4K, Discord, Web</text>
    <text x="16" y="82" class="text-node-d">Аппаратная десинхронизация TCP</text>
  </g>

  <!-- PATH 3: SECURE PROXY (CYAN) -->
  <g transform="translate(930, 345)">
    <rect width="220" height="90" rx="10" fill="url(#card-bg-subtle)" stroke="#00F0FF" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#00F0FF" fill-opacity="0.15"/>
    <text x="20" y="34" font-size="16">🛡️</text>
    <text x="50" y="28" class="text-node-h" fill="#00F0FF">sing-box Core</text>
    <text x="50" y="42" class="text-badge" fill="#38BDF8">VLESS Reality / H2</text>
    <text x="16" y="68" class="text-node-d">Instagram, Twitter, AI Tools</text>
    <text x="16" y="82" class="text-node-d">Зашифрованный внешний туннель</text>
  </g>
</svg>
