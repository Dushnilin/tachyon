<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">tachyon — оркестратор селективной маршрутизации и туннелирования для OpenWrt</title>
  <desc id="desc">Система селективной маршрутизации, мульти-движкового туннелирования (tachyon-core, sing-box, FPTN, OpenVPN), локальной сегментации пакетов (Zapret v2, Zapret v1, ByeDPI) и самодиагностики AI Doctor v3.0 для роутеров OpenWrt.</desc>

  <!-- Canvas -->
  <rect width="1200" height="400" rx="16" fill="#141415"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="15.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <!-- Left column: identity, stack, metrics -->
  <g transform="translate(40, 40)">
    <!-- Status tag -->
    <rect x="0" y="0" width="352" height="28" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="26" y="18" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">openwrt 23.05 · 24.10 · 25.x · snapshot</text>

    <!-- Title & description -->
    <text x="0" y="76" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="48" font-weight="500" letter-spacing="-1">tachyon</text>
    <text x="0" y="112" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400">Оркестратор селективной маршрутизации, проксирования</text>
    <text x="0" y="136" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400">и пакетного управления трафиком для роутеров OpenWrt</text>

    <!-- Supported engines -->
    <g transform="translate(0, 164)">
      <rect x="0" y="0" width="128" height="32" rx="6" fill="#19191b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="64" y="20" text-anchor="middle" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">tachyon-core</text>

      <rect x="136" y="0" width="100" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="186" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">sing-box</text>

      <rect x="244" y="0" width="96" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="292" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">zapret2</text>

      <rect x="348" y="0" width="92" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="394" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">byedpi</text>

      <rect x="448" y="0" width="136" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="516" y="20" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">fptn / ovpn</text>
    </g>

    <!-- Stat cards (same height 68px, 4px grid) -->
    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="184" height="68" rx="8" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="16" y="28" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">4.2 MiB</text>
      <text x="116" y="28" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">RAM</text>
      <text x="16" y="50" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">Rust-ядро в простое</text>

      <rect x="196" y="0" width="184" height="68" rx="8" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="212" y="28" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">480+</text>
      <text x="276" y="28" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">стратегий</text>
      <text x="212" y="50" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">Zapret v2/v1 и ByeDPI</text>

      <rect x="392" y="0" width="192" height="68" rx="8" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
      <text x="408" y="28" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">ucode + LuCI</text>
      <text x="408" y="50" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">от 128 МБ · REST &amp; MCP</text>
    </g>

    <!-- Routing action legend -->
    <g transform="translate(0, 304)">
      <circle cx="6" cy="8" r="4" fill="#38bdf8"/>
      <text x="18" y="12" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Proxy</text>
      <text x="68" y="12" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">туннели и ноды</text>

      <circle cx="196" cy="8" r="4" fill="#4cc38a"/>
      <text x="208" y="12" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Direct</text>
      <text x="268" y="12" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">напрямую 0 ms</text>

      <circle cx="388" cy="8" r="4" fill="#e5484d"/>
      <text x="400" y="12" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Desync</text>
      <text x="464" y="12" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">L3/L4-шейпинг пакетов</text>
    </g>
  </g>

  <!-- Right column: live orchestration specimen -->
  <g transform="translate(664, 32)">
    <rect x="0" y="0" width="496" height="336" rx="12" fill="#0f0f10" stroke="#2e2e32" stroke-width="1"/>

    <!-- Specimen header -->
    <rect x="0" y="0" width="496" height="36" rx="12" fill="#19191b"/>
    <rect x="0" y="24" width="496" height="12" fill="#19191b"/>
    <line x1="0" y1="36" x2="496" y2="36" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="23" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">nftables fw4 → /usr/lib/tachyon → outbounds</text>
    <text x="480" y="23" text-anchor="end" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">procd service</text>

    <!-- Stage 1 -->
    <g transform="translate(16, 52)">
      <rect x="0" y="0" width="464" height="72" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
      <text x="16" y="24" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500">1. Перехват потоков и Smart DNS</text>
      <text x="448" y="24" text-anchor="end" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">198.18.0.0/15</text>
      <text x="16" y="44" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">FakeIP · DoH / DoT / DoQ failover · перехват UDP/TCP 53</text>
      <text x="16" y="60" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">Маршрутизация по .trs / .srs наборам, GeoIP, подсетям и MAC</text>
    </g>

    <!-- Connector 1 -->
    <line x1="248" y1="124" x2="248" y2="140" stroke="#2e2e32" stroke-width="1"/>

    <!-- Stage 2 (highlighted moment) -->
    <g transform="translate(16, 140)">
      <rect x="0" y="0" width="464" height="80" rx="8" fill="#19191b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="16" y="24" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500">2. Туннелирование и шейпинг пакетов</text>
      <text x="448" y="24" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">multi-engine</text>
      <text x="16" y="46" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Ядра прокси: tachyon-core (Rust) и sing-box · FPTN и OpenVPN</text>
      <text x="16" y="64" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Аппаратный десинк без VPS: Zapret v2 (nfqws2), v1 и ByeDPI</text>
    </g>

    <!-- Connector 2 -->
    <line x1="248" y1="220" x2="248" y2="236" stroke="#2e2e32" stroke-width="1"/>

    <!-- Stage 3 -->
    <g transform="translate(16, 236)">
      <rect x="0" y="0" width="226" height="84" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Диагностика и откаты</text>
      <text x="16" y="46" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">AI Doctor v3 · 25 кодов</text>
      <text x="16" y="66" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">Watchdog · PID check</text>

      <rect x="238" y="0" width="226" height="84" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
      <text x="254" y="24" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500">Контуры управления</text>
      <text x="254" y="46" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">LuCI UI · Telegram-бот</text>
      <text x="254" y="66" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">CLI · OpenAPI · MCP</text>
    </g>
  </g>
</svg>
