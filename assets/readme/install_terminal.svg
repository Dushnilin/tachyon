<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="148" viewBox="0 0 1200 148"
     role="img" aria-labelledby="title desc">
  <title id="title">Терминал установки Tachyon Installer</title>
  <desc id="desc">Однострочная команда транзакционной установки Tachyon на роутер OpenWrt с поддержкой автоматического создания снимка конфигурации и миграции из Forkop и Podkop.</desc>

  <rect width="1200" height="148" rx="16" fill="#141415"/>
  <rect x="0.5" y="0.5" width="1199" height="147" rx="15.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <!-- Top bar -->
  <rect x="1" y="1" width="1198" height="36" rx="15" fill="#19191b"/>
  <rect x="1" y="20" width="1198" height="17" fill="#19191b"/>
  <line x1="0" y1="36" x2="1200" y2="36" stroke="#2e2e32" stroke-width="1"/>

  <circle cx="24" cy="18" r="4" fill="#2e2e32"/>
  <circle cx="38" cy="18" r="4" fill="#2e2e32"/>
  <circle cx="52" cy="18" r="4" fill="#2e2e32"/>
  <text x="72" y="22" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">root@openwrt:~ — транзакционный установщик install.sh</text>
  <text x="1176" y="22" text-anchor="end" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">opkg / apk</text>

  <!-- Command row -->
  <rect x="20" y="52" width="1160" height="44" rx="8" fill="#0f0f10" stroke="#2e2e32" stroke-width="1"/>
  <text x="36" y="79" fill="#4cc38a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">root@openwrt:~#</text>
  <text x="160" y="79" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">wget -O /tmp/tachyon-setup.sh https://raw.githubusercontent.com/Dushnilin/tachyon/main/install.sh &amp;&amp; sh /tmp/tachyon-setup.sh</text>

  <!-- Meta footer -->
  <text x="24" y="124" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">Снимок до изменений: /etc/tachyon/installer-backups/ · Миграция из Forkop / Podkop · ZRAM при ≤ 256 МБ RAM</text>
  <text x="1176" y="124" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">--tachyon-core</text>
</svg>
