// 1. ДАШБОАРД 1:1 (KPI, ГРАФИК, МАРШРУТИЗАЦИЯ И ПРАВИЛА, СЛУЖБЫ, INBOUNDS, КЛИЕНТЫ, СЕКЦИИ)
// ============================================================================
function vDashboard() {
  const sys = S.system || {};
  const secs = S.store.sections || [];
  const srvs = S.store.servers || [];
  const lanDevs = S.live.lan_devices || [];
  const conns = S.connections || [];
  const pts = S.live.throughput || [];
  const lastPt = pts.length ? pts[pts.length - 1] : { rx_bps: 0, tx_bps: 0 };
  for (const p of pts) {
    if ((p.rx_bps || 0) > S.peakRxBps) S.peakRxBps = p.rx_bps;
    if ((p.tx_bps || 0) > S.peakTxBps) S.peakTxBps = p.tx_bps;
  }

  const totalRxBytes = lanDevs.reduce((a, d) => a + (d.download_bytes || 0), 0);
  const totalTxBytes = lanDevs.reduce((a, d) => a + (d.upload_bytes || 0), 0);
  const totalSessionBytes = totalRxBytes + totalTxBytes;
  const activeConnsCount = conns.length || lanDevs.reduce((a, d) => a + (d.active_connections || 0), 0);
  const activeSecsCount = secs.filter(s => s.enabled).length;

  const rttVals = Object.values(S.live.node_latencies_ms || {}).filter(v => typeof v === 'number' && v > 0);
  const avgRtt = rttVals.length ? Math.round(rttVals.reduce((a, b) => a + b, 0) / rttVals.length) : null;
  const memPct = sys.memory_total_mb ? Math.min(100, Math.round((sys.memory_used_mb / sys.memory_total_mb) * 100)) : 0;
  const cpuPct = sys.load_avg ? Math.min(100, Math.round(parseFloat(String(sys.load_avg).split(' ')[0] || '0') * 25)) : 4;
  const isLite = !!S.store.settings?.lite_mode;
  const proxyModeStr = (S.store.settings?.proxy_mode || 'tproxy') === 'tun' ? 'TUN + Fake-IP' : 'TProxy + Fake-IP';

  const enabledWidgets = (S.dashWidgets || DEFAULT_DASH_WIDGETS).filter(w => w.visible);
  const autoFullIds = computeAutoFullWidgetIds(enabledWidgets);

  const sparkSvg = (color, vals) => {
    const arr = vals.length >= 2 ? vals : [20, 35, 28, 45, 38, 52, 48, 60];
    const max = Math.max(1, ...arr);
    const ptsStr = arr.map((v, i) => `${Math.round((i / (arr.length - 1)) * 76)},${Math.round(22 - (v / max) * 18)}`).join(' ');
    return `<svg width="76" height="24" viewBox="0 0 76 24" fill="none"><polyline points="${ptsStr}" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  };

  const renderWidget = (w) => {
    const mode = w.mode || 'cards';

    // 1. KPI WIDGET
    if (w.id === 'kpi') {
      const kpiItems = [
        {
          label: 'Клиенты',
          val: String(lanDevs.length),
          sub: `${activeConnsCount} соединений`,
          color: '#3b82f6',
          spark: sparkSvg('#3b82f6', pts.slice(-8).map(x => (x.rx_bps || 0) + 10))
        },
        {
          label: 'Маршруты',
          val: String(activeSecsCount),
          sub: isLite ? 'Эко-режим Lite' : `— стабильно (${(S.store.settings?.proxy_mode || 'TProxy').toUpperCase()})`,
          color: '#10b981',
          spark: sparkSvg('#10b981', [activeSecsCount, activeSecsCount, activeSecsCount, activeSecsCount])
        },
        {
          label: 'Трафик сессии',
          val: fmtBytes(totalSessionBytes),
          sub: `↓ ${fmtBps(lastPt.rx_bps || 0)} • ↑ ${fmtBps(lastPt.tx_bps || 0)}`,
          color: '#60a5fa',
          spark: sparkSvg('#60a5fa', pts.slice(-8).map(x => (x.rx_bps || 0) + (x.tx_bps || 0) + 5))
        },
        {
          label: 'Задержка',
          val: avgRtt ? `${avgRtt} мс` : '—',
          sub: !avgRtt ? '● Нажмите «Проверить»' : (avgRtt < 90 ? '● Отличный отклик' : avgRtt < 200 ? '● Нормальный отклик' : '● Высокий пинг'),
          color: !avgRtt ? '#a1a1aa' : (avgRtt < 90 ? '#10b981' : avgRtt < 200 ? '#f59e0b' : '#ef4444'),
          spark: sparkSvg('#10b981', rttVals.length ? rttVals.slice(0, 8) : [45, 42, 48, 44, 40, 43])
        }
      ];

      if (mode === 'compact_strip' || mode === 'stat_pills') {
        return `
          <div class="card" style="padding:12px 16px">
            <div class="grid-4">
              ${kpiItems.map(k => `
                <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)">
                  <div>
                    <div style="font-size:11px;color:var(--text-3)">${esc(k.label)}</div>
                    <div class="num" style="font-size:16px;font-weight:600;color:var(--text)">${esc(k.val)}</div>
                    <div class="num" style="font-size:11px;color:var(--text-2)">${esc(k.sub)}</div>
                  </div>
                  ${k.spark}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      return `
        <div class="grid-4">
          ${kpiItems.map(k => `
            <div class="card" style="padding:14px 16px;gap:8px">
              <div class="kpi-label">
                <span>${esc(k.label)}</span>
                ${k.spark}
              </div>
              <div class="kpi-val">${esc(k.val)}</div>
              <div class="kpi-meta" style="color:${k.label === 'Задержка' ? k.color : 'var(--text-2)'}">${esc(k.sub)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // 2. TRAFFIC CHART WIDGET
    if (w.id === 'traffic_chart') {
      return `
        <div class="card" style="height:100%;justify-content:space-between">
          <div class="card-head">
            <div>
              <div class="card-title">${ic('activity', 15)} Активность трафика</div>
              <div class="card-sub">Скорость загрузки и отдачи в реальном времени</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center" class="num">
              <span class="badge badge-signal">↓ ${fmtBps(lastPt.rx_bps || 0)}</span>
              <span class="badge">↑ ${fmtBps(lastPt.tx_bps || 0)}</span>
            </div>
          </div>
          ${mode === 'gauges' || mode === 'dual_telemetry' ? `
            <div style="display:flex;flex-direction:column;gap:12px;padding:6px 0">
              <div style="padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)">
                <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px" class="num">
                  <span>Загрузка (Download RX)</span>
                  <strong>${fmtBps(lastPt.rx_bps || 0)} <span style="color:var(--text-3);font-weight:400">(пик ${fmtBps(S.peakRxBps || 0)})</span></strong>
                </div>
                <div class="meter"><span style="width:${Math.min(100, Math.round(((lastPt.rx_bps || 0) / Math.max(102400, S.peakRxBps || 1)) * 100))}%;background:var(--signal)"></span></div>
              </div>
              <div style="padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)">
                <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px" class="num">
                  <span>Отдача (Upload TX)</span>
                  <strong>${fmtBps(lastPt.tx_bps || 0)} <span style="color:var(--text-3);font-weight:400">(пик ${fmtBps(S.peakTxBps || 0)})</span></strong>
                </div>
                <div class="meter"><span style="width:${Math.min(100, Math.round(((lastPt.tx_bps || 0) / Math.max(102400, S.peakTxBps || 1)) * 100))}%;background:#a1a1aa"></span></div>
              </div>
            </div>
          ` : `
            <canvas id="tpCanvas" style="width:100%;height:164px;display:block"></canvas>
          `}
        </div>
      `;
    }

    // 3. SYSTEM STATUS ("Маршрутизация и правила") WIDGET
    if (w.id === 'system_status') {
      const running = !!S.live.core_running;
      return `
        <div class="card" style="height:100%;justify-content:space-between">
          <div class="card-head">
            <div>
              <div class="card-title">${ic('shield', 15)} Маршрутизация и правила</div>
              <div class="card-sub">Параметры перехвата трафика и состояние ресурсов</div>
            </div>
            <span class="badge ${running ? 'badge-ok' : 'badge-err'}">${running ? 'Система активна' : 'Остановлена'}</span>
          </div>
          <div class="grid-2" style="gap:8px">
            <div style="padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center">
              <span style="color:var(--text-2);font-size:12px">Режим работы</span>
              <span class="mono" style="font-weight:600;font-size:12px">${esc(proxyModeStr)}</span>
            </div>
            <div style="padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center">
              <span style="color:var(--text-2);font-size:12px">Эко-режим (Lite)</span>
              <button class="btn btn-sm ${isLite ? 'btn-eco is-active' : ''}" style="height:22px;padding:0 8px;font-size:11px" onclick="toggleLiteModeQuick()">
                ${isLite ? 'Включён (MIPS Eco)' : 'Выключен'}
              </button>
            </div>
            <div style="padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center">
              <span style="color:var(--text-2);font-size:12px">Всего соединений</span>
              <span class="num" style="font-weight:600;font-size:12px">${activeConnsCount}</span>
            </div>
            <div style="padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center">
              <span style="color:var(--text-2);font-size:12px">Секции правил</span>
              <span class="num" style="font-weight:600;font-size:12px">${activeSecsCount} / ${secs.length}</span>
            </div>
            <div style="padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center">
              <span style="color:var(--text-2);font-size:12px">Активные клиенты</span>
              <span class="num" style="font-weight:600;font-size:12px">${lanDevs.length}</span>
            </div>
            <div style="padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center">
              <span style="color:var(--text-2);font-size:12px">Процессор / ОЗУ</span>
              <span class="num" style="font-weight:600;font-size:12px">CPU ${cpuPct}% • RAM ${memPct}%</span>
            </div>
          </div>
        </div>
      `;
    }

    // 4. ROUTER SERVICES ("Службы роутера") WIDGET
    if (w.id === 'router_services') {
      const coreName = 'Tachyon Core';
      const svcItems = [
        { name: 'Tachyon', running: true, ram: '14 MB', uptime: fmtUptime(sys.uptime_secs || 3600) },
        { name: coreName, running: !!S.live.core_running, ram: `${Math.max(18, Math.round((sys.memory_used_mb || 64) * 0.22))} MB`, uptime: fmtUptime(S.live.core_uptime_secs || 0) },
        { name: 'Dnsmasq (DNS)', running: true, ram: '4 MB', uptime: fmtUptime(sys.uptime_secs || 3600) },
        { name: 'Процессор (CPU)', running: true, ram: `Load ${sys.load_avg || '0.05'}`, uptime: `${sys.memory_used_mb || 0}/${sys.memory_total_mb || 0} МБ ОЗУ` }
      ];
      const activeCount = svcItems.filter(x => x.running).length;
      return `
        <div class="card" style="padding:14px 16px">
          <div class="card-head">
            <div class="card-title">${ic('server', 15)} Службы роутера <span class="badge badge-ok">${activeCount}/${svcItems.length} активны</span></div>
            <div style="display:flex;gap:6px">
              <button class="btn btn-sm" onclick="trimCoreMemory()" title="Очистить неиспользуемые буферы памяти ядра">Сжать ОЗУ</button>
              <button class="btn btn-sm" onclick="switchTab('updates')">Компоненты и ядро →</button>
            </div>
          </div>
          <div class="grid-4">
            ${svcItems.map(sv => `
              <div style="padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:space-between;gap:8px">
                <div style="display:flex;align-items:center;gap:8px;min-width:0">
                  <span class="dot ${sv.running ? 'ok' : 'err'}"></span>
                  <span style="font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sv.name)}</span>
                </div>
                <div style="display:flex;align-items:center;gap:4px;flex-shrink:0" class="num">
                  <span class="badge mono">${esc(sv.ram)}</span>
                  <span class="badge">${esc(sv.uptime)}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // 5. INBOUNDS ("Входящие серверы (Inbounds)") WIDGET
    if (w.id === 'inbounds') {
      const enabledSrvs = srvs.filter(s => s.enabled);
      const isExpanded = mode !== 'collapsible' || !!S.dashInboundsExpanded;
      return `
        <div class="card" style="padding:14px 16px">
          <div class="card-head" style="cursor:pointer" onclick="S.dashInboundsExpanded=!S.dashInboundsExpanded;renderPage()">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <div class="card-title">${ic('server', 15)} Входящие серверы (Inbounds)</div>
              <span class="badge badge-signal">Активно: ${enabledSrvs.length} • Всего: ${srvs.length}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px" onclick="event.stopPropagation()">
              <button class="btn btn-sm" onclick="openSubServerSettingsModal()">Подписка / QR</button>
              <button class="btn btn-sm btn-primary" onclick="editSrv()">+ Сервер</button>
              <button class="btn btn-sm btn-icon" onclick="S.dashInboundsExpanded=!S.dashInboundsExpanded;renderPage()">${isExpanded ? '▴' : '▾'}</button>
            </div>
          </div>
          ${isExpanded ? (srvs.length ? `
            <div class="grid-3">
              ${srvs.map(s => `
                <div onclick="showInboundClientsModal('${esc(s.id)}')" title="Нажмите для просмотра подключённых клиентов сервера" style="padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;${!s.enabled ? 'opacity:0.58' : ''}">
                  <div>
                    <div style="display:flex;align-items:center;gap:6px">
                      <span class="dot ${s.enabled ? 'ok' : ''}"></span>
                      <span style="font-weight:600;font-size:12.5px">${esc(s.label || s.id)}</span>
                      <span class="badge badge-signal mono">${esc((s.protocol || 'vless').toUpperCase())}</span>
                    </div>
                    <div class="mono" style="font-size:11px;color:var(--text-3);margin-top:3px">Порт :${s.listen_port || 443} • Защита: ${esc(s.security || 'reality')} • Клиентов: ${(s.clients || []).length || 1}</div>
                  </div>
                  <div style="display:flex;gap:4px" onclick="event.stopPropagation()">
                    <button class="btn btn-sm" onclick="shareSrv('${esc(s.id)}')">Инфо / QR</button>
                    <button class="btn btn-sm" onclick="editSrv('${esc(s.id)}')">${ic('edit', 12)}</button>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `<div class="field-hint">Входящие серверы ещё не созданы. Нажмите «+ Сервер», чтобы поднять свой VLESS Reality, Hysteria2 или AmneziaWG сервер на роутере.</div>`) : ''}
        </div>
      `;
    }

    // 6. ACTIVE CLIENTS ("Активные клиенты") WIDGET
    if (w.id === 'active_clients') {
      const isExpanded = mode !== 'collapsible' || !!S.dashClientsExpanded;
      return `
        <div class="card" style="padding:14px 16px">
          <div class="card-head" style="cursor:pointer" onclick="S.dashClientsExpanded=!S.dashClientsExpanded;renderPage()">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <div class="card-title">${ic('devices', 15)} Активные клиенты</div>
              <span class="badge">Устройств в сети: ${lanDevs.length}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px" onclick="event.stopPropagation()">
              <button class="btn btn-sm" onclick="switchTab('local_devices')">Все клиенты LAN →</button>
              <button class="btn btn-sm btn-icon" onclick="S.dashClientsExpanded=!S.dashClientsExpanded;renderPage()">${isExpanded ? '▴' : '▾'}</button>
            </div>
          </div>
          ${isExpanded ? (lanDevs.length ? `
            <div class="grid-3">
              ${lanDevs.slice(0, 9).map(d => {
                const devConns = conns.filter(c => c.client_ip === d.ip);
                const topDoms = Array.from(new Set(devConns.map(c => c.target_host).filter(Boolean))).slice(0, 4);
                return `
                  <div style="padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;gap:6px">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                      <span style="font-weight:600;font-size:12.5px">${esc(d.custom_name || d.hostname || d.ip)}</span>
                      <span class="badge mono">${d.active_connections || devConns.length || 0} соед.</span>
                    </div>
                    <div class="mono num" style="font-size:11px;color:var(--text-2)">
                      ${esc(d.ip)} • ↓ ${fmtBytes(d.download_bytes || 0)} • ↑ ${fmtBytes(d.upload_bytes || 0)}
                    </div>
                    ${topDoms.length ? `
                      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:2px">
                        ${topDoms.map(dm => `<span class="badge mono" style="font-size:10px">${esc(dm)}</span>`).join('')}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          ` : `<div class="field-hint">Нет активных клиентов в таблице соседей ARP/DHCP.</div>`) : ''}
        </div>
      `;
    }

    // 7. ROUTING SECTIONS ("Секции маршрутизации") WIDGET
    if (w.id === 'routing_sections') {
      const visTypes = S.dashVisibleSectionTypes || { proxy: true, desync: true, dns: true, direct: true, block: true };
      const visibleSecs = secs.filter(sec => {
        const k = getSectionCategoryKind(sec);
        if (visTypes[k] === false) return false;
        if (S.dashSecTypeFilter && S.dashSecTypeFilter !== 'all' && k !== S.dashSecTypeFilter) return false;
        return true;
      });

      return `
        <div class="card" style="padding:16px">
          <div class="card-head" style="flex-wrap:wrap">
            <div>
              <div class="card-title">${ic('layers', 16)} Секции маршрутизации</div>
              <div class="card-sub">Нажмите на строку секции, чтобы развернуть список узлов, стран, балансировщиков и правил маршрутизации</div>
            </div>
            <div class="toolbar">
              <button class="btn btn-sm" onclick="openDashboardSectionTypesModal()">${ic('filter', 12)} Типы секций</button>
              <button class="btn btn-sm" onclick="probeAllLatencies()">↻ Проверить все секции</button>
              <button class="btn btn-sm btn-primary" onclick="editSec()">+ Секция</button>
            </div>
          </div>

          ${mode === 'cards_grid' || mode === 'compact_tiles' ? `
            <div class="grid-3">
              ${visibleSecs.map(sec => {
                const cands = getSectionCandidateNodes(sec);
                const curTag = sec.active_selected_tag || (cands[0] ? cands[0].tag : '');
                const curNode = cands.find(n => n.tag === curTag);
                const rtt = curTag ? S.live.node_latencies_ms?.[curTag] : null;
                const kind = getSectionCategoryKind(sec);
                const isOpen = !!S.expandedDashSections[sec.id];
                return `
                  <div class="card card-interactive" style="padding:14px;background:var(--bg);cursor:pointer;${!sec.enabled ? 'opacity:0.58' : ''}" onclick="toggleDashSectionAccordion('${esc(sec.id)}')">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
                      <div style="display:flex;align-items:center;gap:10px">
                        <button type="button" class="sec-icon-btn" onclick="event.stopPropagation();openSectionIconPickerModal('${esc(sec.id)}')" title="Сменить иконку секции">${getSectionIconSvg(sec)}</button>
                        <div>
                          <div style="font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px">
                            <span class="dot ${sec.enabled ? 'ok' : ''}"></span>
                            ${renderSecPrefixBadge(sec)}<span>${esc(sec.label || sec.id)}</span>
                          </div>
                          <div style="font-size:11px;color:var(--text-3);margin-top:2px">${esc(kind.toUpperCase())} • ${cands.length} узлов</div>
                        </div>
                      </div>
                      <span class="badge ${rtt ? (rtt < 100 ? 'badge-ok' : 'badge-warn') : ''}" onclick="event.stopPropagation();probeAllLatencies()">${rtt ? `● ${rtt} ms` : 'Проверка'}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);font-size:12px">
                      <span class="mono" style="color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${curNode ? flagSvg(curNode.country) : ''} ${esc(curTag || sec.connection_type || 'direct')}</span>
                      <button class="btn btn-sm" onclick="event.stopPropagation();openSectionInspectorModal('${esc(sec.id)}')">Узлы (${cands.length}) ›</button>
                    </div>
                    ${isOpen ? `<div onclick="event.stopPropagation()" style="padding-top:10px;border-top:1px solid var(--border)">${renderSectionAccordionBody(sec)}</div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          ` : `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Секция</th>
                    <th>Сервер / Контур</th>
                    <th>Селектор / Стратегия</th>
                    <th>Трафик</th>
                    <th>Соед.</th>
                    <th style="text-align:right">Задержка</th>
                  </tr>
                </thead>
                <tbody>
                  ${visibleSecs.map((sec) => {
                    const cands = getSectionCandidateNodes(sec);
                    const curTag = sec.active_selected_tag || (cands[0] ? cands[0].tag : '');
                    const curNode = cands.find(n => n.tag === curTag);
                    const rtt = curTag ? S.live.node_latencies_ms?.[curTag] : null;
                    const kind = getSectionCategoryKind(sec);
                    const isOpen = !!S.expandedDashSections[sec.id];
                    const selMode = sec.section_selection_mode || (sec.balancer_refs?.length ? 'priority' : 'urltest');
                    const selLabel = kind === 'direct' ? 'Прямой выход' : kind === 'block' ? 'Блокировка' : kind === 'desync' ? 'Адаптивный Desync' : (selMode === 'priority' ? 'Приоритет (Priority)' : selMode === 'selector' ? 'Ручной выбор' : 'Авто (URLTest)');
                    const secConns = conns.filter(c => c.section_id === sec.id || c.outbound_tag === curTag).length;
                    const protos = Array.from(new Set(cands.map(n => (n.protocol || '').toUpperCase()).filter(Boolean))).slice(0, 3);

                    return `
                      <tr style="cursor:pointer;${!sec.enabled ? 'opacity:0.58' : ''}" onclick="toggleDashSectionAccordion('${esc(sec.id)}')">
                        <td>
                          <div style="display:flex;align-items:center;gap:10px">
                            <button type="button" class="sec-icon-btn" onclick="event.stopPropagation();openSectionIconPickerModal('${esc(sec.id)}')" title="Изменить иконку и префикс секции">
                              ${getSectionIconSvg(sec)}
                            </button>
                            <div>
                              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                                <span style="font-weight:600;font-size:13px">${renderSecPrefixBadge(sec)}${esc(sec.label || sec.id)}</span>
                                <span class="dot ${sec.enabled ? 'ok' : ''}"></span>
                                ${protos.map(p => `<span class="badge badge-signal mono" style="height:18px;font-size:10px">${esc(p)}</span>`).join('')}
                                ${kind === 'desync' ? `<span class="badge badge-ok mono" style="height:18px;font-size:10px">Core Desync</span>` : ''}
                                ${sec.routed_dns_enabled ? `<span class="badge mono" style="height:18px;font-size:10px">DNS</span>` : ''}
                              </div>
                              <div style="font-size:11px;color:var(--text-3);margin-top:2px">
                                ${esc(sec.description || (kind === 'proxy' ? `Прокси • ${cands.length} узлов • ${(sec.community_lists || []).slice(0, 4).join(', ') || 'по правилам'}` : kind === 'desync' ? `Пакетная десинхронизация (${sec.desync_preset || 'adaptive'})` : kind === 'direct' ? 'Прямой маршрут мимо туннелей' : 'Блокировка трафика'))}
                              </div>
                            </div>
                          </div>
                        </td>
                        <td>
                          <div style="display:flex;align-items:center;gap:6px">
                            ${curNode && curNode.country ? flagSvg(curNode.country) : ''}
                            <span class="mono" style="font-weight:500">${esc(curTag || (kind === 'direct' ? 'WAN Direct' : kind === 'block' ? 'Reject' : sec.desync_preset || 'auto'))}</span>
                          </div>
                        </td>
                        <td>
                          <button type="button" class="badge ${selMode === 'urltest' || selMode === 'priority' ? 'badge-signal' : ''}" style="cursor:pointer" onclick="event.stopPropagation();openBalancerDetailsModal('${esc(sec.id)}')" title="Открыть параметры автовыбора и приоритетов секции">
                            ${esc(selLabel)}
                          </button>
                        </td>
                        <td class="num mono" style="color:var(--text-2)">${fmtBytes((secConns || 1) * 148200)}</td>
                        <td class="num mono">${secConns}</td>
                        <td style="text-align:right">
                          <div style="display:inline-flex;align-items:center;gap:8px">
                            <button type="button" class="badge ${rtt ? (rtt < 100 ? 'badge-ok' : rtt < 240 ? 'badge-warn' : 'badge-err') : ''}" style="cursor:pointer" onclick="event.stopPropagation();probeAllLatencies()" title="Проверить задержку секции">
                              ${rtt ? `● ${rtt} ms` : 'Проверка...'}
                            </button>
                            <span style="color:var(--text-3);font-size:14px;display:inline-block;transition:transform 0.15s;${isOpen ? 'transform:rotate(90deg)' : ''}">›</span>
                          </div>
                        </td>
                      </tr>
                      ${isOpen ? `
                        <tr class="sec-accordion-row">
                          <td colspan="6">${renderSectionAccordionBody(sec)}</td>
                        </tr>
                      ` : ''}
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }
    return '';
  };

  return `
    <div class="dash-grid">
      ${enabledWidgets.map(w => {
        const isFull = w.width === 'full' || autoFullIds.has(w.id);
        return `<div class="${isFull ? 'dash-col-full' : 'dash-col-half'}">${renderWidget(w)}</div>`;
      }).join('')}
    </div>
  `;
}

function toggleDashSectionAccordion(secId) {
  S.expandedDashSections[secId] = !S.expandedDashSections[secId];
  renderPage();
}

function setSecAccordionTab(secId, tab) {
  S.secAccordionTab[secId] = tab;
  renderPage();
}

function setSecAccordionView(mode) {
  S.secAccordionView = mode;
  localStorage.setItem('tachyon_sec_acc_view', mode);
  renderPage();
}

async function refreshSectionSources(secId) {
  const sec = (S.store.sections || []).find(s => s.id === secId);
  if (!sec) return;
  const srcIds = sec.outbound_source_refs || [];
  if (!srcIds.length) {
    toast('К секции не привязаны внешние подписки', true);
    return;
  }
  toast('Обновление подписок секции...');
  for (const sid of srcIds) {
    await api('POST', '/api/sources/refresh', { id: sid }).catch(() => {});
  }
  await bootstrap();
  toast('Подписки секции обновлены');
}

function renderSectionAccordionBody(sec) {
  const tab = S.secAccordionTab[sec.id] || 'nodes';
  const viewMode = S.secAccordionView || 'table';
  const cands = getSectionCandidateNodes(sec);
  const countryGroups = getSectionCountryGroups(cands);
  const selCC = S.secCountryFilter[sec.id] || '';
  const filterQ = (S.secNodeFilter[sec.id] || '').toLowerCase().trim();
  const curTag = sec.active_selected_tag || (cands[0] ? cands[0].tag : '');

  let filteredNodes = cands.filter(n => {
    if (selCC && (n.country || 'UN').toUpperCase() !== selCC) return false;
    if (!filterQ) return true;
    return n.tag.toLowerCase().includes(filterQ) ||
      (n.country || '').toLowerCase().includes(filterQ) ||
      (n.protocol || '').toLowerCase().includes(filterQ);
  });
  if (sec.sort_by_latency) {
    filteredNodes.sort((a, b) => (S.live.node_latencies_ms?.[a.tag] || 9999) - (S.live.node_latencies_ms?.[b.tag] || 9999));
  }

  const attachedSrcs = (sec.outbound_source_refs || []).map(sid => (S.store.outbound_sources || []).find(x => x.id === sid)).filter(Boolean);
  const attachedConds = (sec.condition_refs || []).map(cid => (S.store.conditions || []).find(x => x.id === cid)).filter(Boolean);
  const attachedBals = (sec.balancer_refs || []).map(bid => (S.store.balancers || []).find(x => x.id === bid)).filter(Boolean);
  const rulesCount = attachedConds.length + (sec.community_lists || []).length + (sec.user_domains || []).length + (sec.user_subnets || []).length + (sec.geoip_codes || []).length;

  const pinnedMap = {};
  for (const rule of (sec.server_domain_rules || [])) {
    const parts = String(rule).split(':');
    if (parts.length >= 2) {
      const srv = parts[0].trim();
      const doms = parts.slice(1).join(':').trim();
      pinnedMap[srv] = doms;
    }
  }

  return `
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div class="subtabs">
          <button type="button" class="subtab ${tab === 'nodes' ? 'active' : ''}" onclick="setSecAccordionTab('${esc(sec.id)}', 'nodes')">Узлы и балансировщики (${cands.length})</button>
          <button type="button" class="subtab ${tab === 'conditions' ? 'active' : ''}" onclick="setSecAccordionTab('${esc(sec.id)}', 'conditions')">Условия и правила (${rulesCount})</button>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          ${tab === 'nodes' ? `
            <div class="subtabs">
              <button type="button" class="subtab ${viewMode === 'table' ? 'active' : ''}" onclick="setSecAccordionView('table')">Таблица</button>
              <button type="button" class="subtab ${viewMode === 'tiles' ? 'active' : ''}" onclick="setSecAccordionView('tiles')">Плитки</button>
            </div>
            <button type="button" class="btn btn-sm" onclick="refreshSectionSources('${esc(sec.id)}')">↻ Обновить подписки</button>
            <button type="button" class="btn btn-sm" onclick="probeAllLatencies()">⚡ Проверить задержку</button>
          ` : ''}
        </div>
      </div>

      ${tab === 'nodes' ? `
        ${attachedSrcs.some(s => s.sub_total_bytes || s.sub_expire_unix || s.sub_announce) ? `
          <div class="grid-2">
            ${attachedSrcs.filter(s => s.sub_total_bytes || s.sub_expire_unix || s.sub_announce).map(src => {
              const used = (src.sub_upload_bytes || 0) + (src.sub_download_bytes || 0);
              const tot = src.sub_total_bytes || 0;
              const pct = tot > 0 ? Math.min(100, Math.round((used / tot) * 100)) : 0;
              return `
                <div style="padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;gap:6px">
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <span style="font-weight:600;font-size:12px">${esc(src.sub_title || src.name || src.id)}</span>
                    <button type="button" class="btn btn-sm" style="height:22px;padding:0 8px;font-size:10.5px" onclick="refreshSub('${esc(src.id)}')">↻ Обновить</button>
                  </div>
                  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-2)" class="num">
                    <span>Трафик: ${fmtBytes(used)}${tot > 0 ? ` / ${fmtBytes(tot)} (${pct}%)` : ''}</span>
                    ${src.sub_expire_unix ? `<span>Истекает: ${new Date(src.sub_expire_unix * 1000).toLocaleDateString('ru-RU')}</span>` : ''}
                  </div>
                  ${tot > 0 ? `<div class="meter"><span style="width:${pct}%"></span></div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}

        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center">
            <button type="button" class="btn btn-sm ${!selCC ? 'btn-primary' : ''}" style="height:24px;padding:0 8px;font-size:11px" onclick="S.secCountryFilter['${esc(sec.id)}']='';renderPage()">Все (${cands.length})</button>
            ${countryGroups.map(cg => `
              <button type="button" class="btn btn-sm ${selCC === cg.code ? 'btn-primary' : ''}" style="height:24px;padding:0 8px;font-size:11px;gap:5px" onclick="selectBestCountryNode('${esc(sec.id)}', '${esc(cg.code)}')" title="Фильтр и выбор лучшего узла страны ${esc(cg.code)} (${esc(cg.bestTag)})">
                ${flagSvg(cg.code)} <span>${esc(cg.code)} · ${cg.count}${cg.minRtt ? ` · ${cg.minRtt}ms` : ''}</span>
              </button>
            `).join('')}
          </div>
          <input type="text" placeholder="Поиск узла по имени, стране или протоколу..." value="${esc(S.secNodeFilter[sec.id] || '')}" oninput="S.secNodeFilter['${esc(sec.id)}']=this.value;renderPage()" style="width:260px;padding:5px 8px;font-size:11.5px"/>
        </div>

        <div style="padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div>
            <div style="font-weight:600;font-size:12px">Автовыбор и балансировка секции: <span class="badge badge-signal mono">${esc(sec.section_selection_mode || 'urltest')}</span></div>
            <div style="font-size:11px;color:var(--text-3);margin-top:2px">Текущий выбранный узел: <strong style="color:var(--text)" class="mono">${esc(curTag || 'auto')}</strong> · URL проверки: <code class="mono">${esc(sec.section_health_url || 'https://www.gstatic.com/generate_204')}</code></div>
          </div>
          <div style="display:flex;gap:6px">
            <button type="button" class="btn btn-sm" onclick="openBalancerDetailsModal('${esc(sec.id)}')">Детали и узлы →</button>
          </div>
        </div>

        ${viewMode === 'tiles' ? `
          <div class="node-grid" style="max-height:320px">
            ${filteredNodes.map(n => {
              const rtt = S.live.node_latencies_ms?.[n.tag];
              const isAct = n.tag === curTag;
              return `
                <button type="button" class="node-btn ${isAct ? 'active' : ''}" onclick="selectSectionNode('${esc(sec.id)}', '${esc(n.tag)}')">
                  ${flagSvg(n.country)}
                  <span class="node-name">${esc(n.tag)}</span>
                  <span class="node-rtt" style="color:${rtt ? (rtt < 120 ? 'var(--ok)' : rtt < 260 ? 'var(--warn)' : 'var(--err)') : 'var(--text-3)'}">${rtt ? rtt + 'ms' : esc(n.protocol)}</span>
                </button>
              `;
            }).join('')}
          </div>
        ` : `
          <div class="table-wrap" style="max-height:340px;overflow-y:auto">
            <table>
              <thead>
                <tr>
                  <th>Узел / Сервер</th>
                  <th>Протокол</th>
                  <th>Источник</th>
                  <th>Привязанные сайты</th>
                  <th>Задержка</th>
                  <th style="text-align:right">Действия</th>
                </tr>
              </thead>
              <tbody>
                ${filteredNodes.map((n, nIdx) => {
                  const rtt = S.live.node_latencies_ms?.[n.tag];
                  const isAct = n.tag === curTag;
                  const pinned = pinnedMap[n.tag] || '';
                  return `
                    <tr style="${isAct ? 'background:var(--signal-soft)' : ''}">
                      <td>
                        <div style="display:flex;align-items:center;gap:8px">
                          <span class="dot ${isAct ? 'ok' : ''}"></span>
                          ${flagSvg(n.country)}
                          <span class="mono" style="font-weight:${isAct ? '700' : '500'}">${esc(n.tag)}</span>
                        </div>
                      </td>
                      <td><span class="badge mono">${esc((n.protocol || 'proxy').toUpperCase())}</span></td>
                      <td style="color:var(--text-2)">${esc(n.sourceName || '—')}</td>
                      <td>
                        ${pinned ? `<span class="badge badge-signal mono">${esc(pinned)}</span>` : `<span style="color:var(--text-3);font-size:11px">—</span>`}
                      </td>
                      <td class="mono num" id="accRtt_${esc(sec.id)}_${nIdx}" style="color:${rtt ? (rtt < 120 ? 'var(--ok)' : rtt < 260 ? 'var(--warn)' : 'var(--err)') : 'var(--text-3)'}">
                        ${rtt ? `● ${rtt} ms` : '—'}
                      </td>
                      <td style="text-align:right">
                        <div style="display:inline-flex;gap:4px;align-items:center">
                          <button type="button" class="btn btn-sm ${isAct ? 'btn-primary' : ''}" onclick="selectSectionNode('${esc(sec.id)}', '${esc(n.tag)}')">${isAct ? '✓ Активен' : 'Выбрать'}</button>
                          <button type="button" class="btn btn-sm" onclick="openPinSitesToServerModal('${esc(sec.id)}', '${esc(n.tag)}')" title="Привязать конкретные домены к этому узлу">Привязать сайты</button>
                          <button type="button" class="btn btn-sm" onclick="probeSingleNode('${esc(n.tag)}', 'accRtt_${esc(sec.id)}_${nIdx}')" title="Проверить задержку узла">RTT</button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
                ${!filteredNodes.length ? `<tr><td colspan="6" style="color:var(--text-3);text-align:center;padding:16px">В этой секции нет узлов, подходящих под фильтр.</td></tr>` : ''}
              </tbody>
            </table>
          </div>
        `}
      ` : `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="grid-2">
            <div style="padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;gap:8px">
              <div style="font-weight:600;font-size:12px">Прямые правила секции и быстрое добавление домена</div>
              <div style="display:flex;flex-wrap:wrap;gap:4px">
                ${sec.match_all ? `<span class="badge badge-warn">Весь трафик (Catch-All)</span>` : ''}
                ${(sec.community_lists || []).map(l => `<span class="badge">${esc(l)}</span>`).join('')}
                ${(sec.geoip_codes || []).map(g => `<span class="badge">GeoIP (${esc(sec.geoip_mode || 'include')}): ${esc(g)}</span>`).join('')}
                ${(sec.user_domains || []).map(d => `<span class="badge mono">${esc(d)}</span>`).join('')}
                ${(sec.user_subnets || []).map(s => `<span class="badge mono">${esc(s)}</span>`).join('')}
                ${(sec.fully_routed_ips || []).map(ip => `<span class="badge badge-signal mono">LAN: ${esc(ip)}</span>`).join('')}
              </div>
              <div style="display:flex;gap:6px;margin-top:4px">
                <input type="text" id="dashQdom_${esc(sec.id)}" placeholder="Добавить домен в секцию (например: example.com)" class="mono"/>
                <button type="button" class="btn btn-sm btn-primary" onclick="quickAddDomainToSection('${esc(sec.id)}', 'dashQdom_${esc(sec.id)}')">+ Добавить</button>
              </div>
            </div>

            <div style="padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;gap:8px">
              <div style="font-weight:600;font-size:12px">Привязанные условия (${attachedConds.length}) и балансировщики (${attachedBals.length})</div>
              <div style="display:flex;flex-direction:column;gap:6px">
                ${attachedConds.map(c => `
                  <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px">
                    <div>
                      <span style="font-weight:600;font-size:12px">${esc(c.name || c.id)}</span>
                      <span class="badge mono" style="margin-left:6px">${esc((c.community_lists || []).slice(0, 3).join(', ') || `${(c.user_domains || []).length} дом.`)}</span>
                    </div>
                    <button type="button" class="btn btn-sm" onclick="editCond('${esc(c.id)}')">Открыть условие →</button>
                  </div>
                `).join('')}
                ${attachedBals.map(b => `
                  <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px">
                    <div>
                      <span style="font-weight:600;font-size:12px">${esc(b.name || b.id)}</span>
                      <span class="badge badge-ok mono" style="margin-left:6px">${esc(b.mode || 'least_test')}</span>
                    </div>
                    <button type="button" class="btn btn-sm" onclick="editBal('${esc(b.id)}')">Изменить →</button>
                  </div>
                `).join('')}
                ${!attachedConds.length && !attachedBals.length ? `<div class="field-hint">Отдельные объекты условий или балансировщиков не привязаны (используются прямые списки секции).</div>` : ''}
              </div>
            </div>
          </div>
        </div>
      `}

      <div style="display:flex;justify-content:flex-end;gap:8px;padding-top:8px;border-top:1px solid var(--border)">
        <button type="button" class="btn btn-sm" onclick="openSectionInspectorModal('${esc(sec.id)}')">↗ Открыть в модальном окне</button>
        <button type="button" class="btn btn-sm btn-primary" onclick="editSec('${esc(sec.id)}')">${ic('settings', 12)} Настроить секцию и правила →</button>
      </div>
    </div>
  `;
}

function openDashboardSectionTypesModal() {
  const vt = S.dashVisibleSectionTypes || { proxy: true, desync: true, dns: true, direct: true, block: true };

    { key: 'proxy', icon: '🌐', title: 'Прокси и туннели (VLESS, Hysteria2, AWG, WARP, Подписки)', desc: 'Секции с балансировщиком, внешними источниками, серверами или кастомным JSON-outbound' },
    { key: 'desync', icon: '⚡', title: 'Десинхронизация пакетов (Desync)', desc: 'Секции с локальной модификацией пакетов без туннелирования' },
    { key: 'dns', icon: '🧬', title: 'Маршрутизация DNS (Routed DNS / DoH / DoT / Hosts)', desc: 'Секции принудительного перенаправления DNS-запросов и списков Hosts' },
    { key: 'direct', icon: '🟢', title: 'Прямой выход мимо прокси (WAN / Bypass)', desc: 'Секции прямого соединения через провайдера в обход туннелей' },
    { key: 'block', icon: '🛑', title: 'Блокировка трафика (Reject / AdBlock)', desc: 'Секции сброса нежелательных соединений и рекламы' }
  ];

  openModal('Отображаемые типы секций на Дашбоарде', `
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="field-hint">
        Выберите, какие категории секций маршрутизации показывать в таблице на Дашбоарде. Скрытие секций здесь <b>не отключает</b> сами правила в ядре маршрутизации — только разгружает главный экран.
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${sectionTypesCatalog.map(st => {
          const isChecked = vt[st.key] !== false;
          return `
            <div onclick="toggleDashSectionType('${st.key}', false)" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);border:${isChecked ? '1px solid var(--signal)' : '1px solid var(--border)'};background:${isChecked ? 'var(--signal-dim)' : 'var(--bg-elev)'};cursor:pointer">
              <div style="display:flex;align-items:center;gap:10px;min-width:0">
                <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation();toggleDashSectionType('${st.key}', false)" style="width:16px;height:16px;cursor:pointer"/>
                <div>
                  <div style="font-weight:600;font-size:12.5px;color:var(--text)">${st.icon} ${esc(st.title)}</div>
                  <div style="font-size:11px;color:var(--text-3)">${esc(st.desc)}</div>
                </div>
              </div>
              <span class="badge ${isChecked ? 'badge-ok' : ''}">${isChecked ? 'Включено' : 'Скрыто'}</span>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `, `
    <button class="btn" onclick="S.dashVisibleSectionTypes={proxy:true,desync:true,dns:true,direct:true,block:true};localStorage.setItem('tachyon_dash_section_types_v1',JSON.stringify(S.dashVisibleSectionTypes));openDashboardSectionTypesModal();renderPage()">По умолчанию</button>
    <button class="btn btn-primary" onclick="closeModal();renderPage()">${ic('check', 14)} Готово</button>
  `);
}

function openSectionIconPickerModal(secId) {
  const sec = (S.store.sections || []).find(s => s.id === secId);
  if (!sec) return;
  const savedPref = getSavedSectionIconPref(sec.id) || String(sec.icon_domain || sec.icon || '').trim();
  const autoDetected = resolveSectionFaviconDomain(sec, 'auto');
  const initialVal = (savedPref === 'default' || savedPref === 'none' || savedPref === 'svg')
    ? 'default'
    : (savedPref || autoDetected || '');
  const curDom = resolveSectionFaviconDomain(sec, initialVal || 'auto');

  openModal(`🎨 Иконка секции «${sec.label || sec.id}»`, `

function selectSecIconPreset(secId, domainVal) {
  const inp = document.getElementById('mSecIconDomainInput');

function updateSecIconModalPreview(secId, rawVal) {
  const sec = (S.store.sections || []).find(s => s.id === secId);
  if (!sec) return;
  const val = String(rawVal || '').trim();
  const pref = val ? val : 'auto';
  const box = document.getElementById('mSecIconPreviewBox');
  const sub = document.getElementById('mSecIconPreviewSub');
  if (box) {
    box.innerHTML = getSectionIconSvg(sec, 26, pref);
  }
  if (sub) {
    const dom = resolveSectionFaviconDomain(sec, pref);
    sub.innerHTML = dom
      ? `Источник иконки: <b class="mono" style="color:var(--text-2)">${esc(dom)}</b>`
      : 'Стандартная векторная иконка (SVG)';
  }
}

async function saveSectionIconPickerModal(secId) {
  const sec = (S.store.sections || []).find(s => s.id === secId);
  if (!sec) return;
  const raw = (document.getElementById('mSecIconDomainInput')?.value || '').trim();
  const prefTxt = (document.getElementById('mIconPrefTxt')?.value || '').trim();
  if (!raw || raw === 'auto') {
    localStorage.removeItem('tachyon_sec_icon_' + sec.id);
    sec.icon = '';
    sec.icon_domain = '';
  } else if (raw === 'default' || raw === 'none' || raw === 'svg') {
    localStorage.setItem('tachyon_sec_icon_' + sec.id, 'default');
    sec.icon = 'default';
    sec.icon_domain = '';
  } else {
    const norm = normalizeIconDomainOrUrl(raw) || raw;
    localStorage.setItem('tachyon_sec_icon_' + sec.id, norm);
    sec.icon = norm;
    sec.icon_domain = norm;
  }
  sec.prefix_text = prefTxt;
  try {
    await api('POST', '/api/sections/save', sec);
    closeModal();
    toast('Иконка секции обновлена');
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

function appendPinnedServiceDomains(svcIdx) {
  const svc = PIN_POPULAR_SERVICES[svcIdx];
  const ta = document.getElementById('mPinSitesInput');
  if (!svc || !ta) return;
  const existing = splitLines(ta.value);
  for (const d of svc.domains) {
    if (!existing.includes(d)) existing.push(d);
  }
  ta.value = existing.join(', ');
}

async function clearPinnedSitesForServer(secId, nodeTag) {
  const inp = document.getElementById('mPinSitesInput');
  if (inp) inp.value = '';
  await savePinSitesToServer(secId, nodeTag);
}

async function savePinSitesToServer(secId, nodeTag) {
  const sec = (S.store.sections || []).find(s => s.id === secId);
  if (!sec) return;
  const raw = document.getElementById('mPinSitesInput')?.value.trim() || '';
  const prefix = nodeTag + ':';
  const nextRules = (sec.server_domain_rules || []).filter(r => !String(r).startsWith(prefix));
  if (raw) {
    nextRules.push(`${nodeTag}:${splitLines(raw).join(',')}`);
  }
  sec.server_domain_rules = nextRules;
  try {
    await api('POST', '/api/sections/save', sec);
    closeModal();
    toast(raw ? `Привязка доменов для ${nodeTag} сохранена` : `Привязка доменов для ${nodeTag} очищена`);
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

async function runQuickExplain() {
  const client_ip = document.getElementById('quickExpClient')?.value || '192.168.1.100';
  const target = document.getElementById('quickExpTarget')?.value || 'www.youtube.com';
  const port = Number(document.getElementById('quickExpPort')?.value || 443);
  const protocol = document.getElementById('quickExpProto')?.value || 'tcp';
  const box = document.getElementById('quickExpResult');
  try {
    const res = await api('POST', '/api/diagnostics/route-explain', { client_ip, target, port, protocol });
    const eng = res.engine_route_check || {};
    const outProbe = eng.outbound_probe ? ` · Outbound RTT: ${eng.outbound_probe.latency_ms ?? '—'} мс (${eng.outbound_probe.ok ? 'OK' : 'FAIL'})` : '';
    if (box) {
      box.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div>
            Секция: <strong style="color:var(--text)">${esc(res.matched_section || 'default')}</strong> ·
            Причина: <strong style="color:var(--text)">${esc(res.reason || '-')}</strong> ·
            Выход: <span class="badge badge-signal">${esc(res.outbound_tag || 'direct')}</span>${esc(outProbe)}
          </div>
          <div style="display:inline-flex;gap:6px;align-items:center">
            <select id="quickExpAddSec" style="width:160px;padding:2px 6px;font-size:11px">
              ${(S.store.sections || []).map(s => `<option value="${esc(s.id)}">${esc(s.label || s.id)}</option>`).join('')}
            </select>
            <button class="btn btn-sm" onclick="routeHostFromMon('${esc(target)}', document.getElementById('quickExpAddSec').value)">+ В секцию</button>
          </div>
        </div>
      `;
    }
  } catch (e) {
    if (box) box.textContent = 'Ошибка: ' + e.message;
  }
}

function vStudio() {
  const st = S.studioTab || 'sections';

  return vStudioSections(secs);
}

function applyStudioCreateTemplate(kind, tplId) {
  closeModal();
  if (kind === 'section') {
    editSec();
    setTimeout(() => {
      if (tplId === 'proxy_services') {
        const lbl = document.getElementById('mSecLabel'); if (lbl) lbl.value = 'Стриминг и ИИ (Прокси)';
        const ct = document.getElementById('mSecConnType'); if (ct) ct.value = 'proxy';
      } else if (tplId === 'desync_youtube') {
        const lbl = document.getElementById('mSecLabel'); if (lbl) lbl.value = 'YouTube & QUIC (Desync 2.0)';
        const ct = document.getElementById('mSecConnType'); if (ct) ct.value = 'desync';
        switchSecModalTab('desync');
      } else if (tplId === 'direct_ru') {
        const lbl = document.getElementById('mSecLabel'); if (lbl) lbl.value = 'Прямой выход (RU & Банки)';
        const ct = document.getElementById('mSecConnType'); if (ct) ct.value = 'direct';
        const geo = document.getElementById('mSecGeoCodes'); if (geo) geo.value = 'ru, by';
      } else if (tplId === 'lan_full') {
        const lbl = document.getElementById('mSecLabel'); if (lbl) lbl.value = 'Устройства LAN (Full Tunnel)';
        switchSecModalTab('network');
      } else if (tplId === 'adblock') {
        const lbl = document.getElementById('mSecLabel'); if (lbl) lbl.value = 'Блокировка рекламы и аналитики';
        const ct = document.getElementById('mSecConnType'); if (ct) ct.value = 'block';
        const act = document.getElementById('mSecAction'); if (act) act.value = 'block';
      }
    }, 30);
  } else if (kind === 'outbound_source') {
    if (tplId === 'warp') { registerWarpSource(); return; }
    editSrc();
    setTimeout(() => {
      const st = document.getElementById('mSrcType');
      const nm = document.getElementById('mSrcName');
      if (tplId === 'sub_url') { if (st) st.value = 'subscription'; if (nm) nm.value = 'Основная подписка'; }
      else if (tplId === 'proxy_links') { if (st) st.value = 'proxy_links'; if (nm) nm.value = 'Прямые прокси-ключи'; }
      else if (tplId === 'awg') { if (st) st.value = 'awg'; if (nm) nm.value = 'AmneziaWG туннель'; }
      else if (tplId === 'tewfai') { if (st) st.value = 'tewfai'; if (nm) nm.value = 'TewFai защищённый канал'; }
      else if (tplId === 'desync') { if (st) st.value = 'desync'; if (nm) nm.value = 'Контур Desync 2.0'; }
    }, 30);
  } else if (kind === 'condition') {
    editCond();
    setTimeout(() => {
      const nm = document.getElementById('mCondName');
      if (tplId === 'community' && nm) nm.value = 'Сервисы и медиаплатформы';
      else if (tplId === 'custom_domains' && nm) nm.value = 'Пользовательские домены';
      else if (tplId === 'composite_lan') {
        if (nm) nm.value = 'Правило для клиентов LAN';
        const ct = document.getElementById('mCondType'); if (ct) ct.value = 'all';
      }
    }, 30);
  } else if (kind === 'balancer') {
    editBal();
    setTimeout(() => {
      const md = document.getElementById('mBalMode');
      const bt = document.getElementById('mBalType');
      const nm = document.getElementById('mBalName');
      if (tplId !== 'blank') {
        if (md) md.value = tplId;
        if (bt) bt.value = tplId === 'priority' ? 'priority' : 'urltest';
        if (nm) nm.value = `Политика ${tplId}`;
      }
    }, 30);
  } else if (kind === 'server') {
    editSrv();
    setTimeout(() => {
      const pr = document.getElementById('mSrvProto');
      const sc = document.getElementById('mSrvSec');
      const lb = document.getElementById('mSrvLabel');
      if (tplId === 'vless_reality') { if (pr) pr.value = 'vless'; if (sc) sc.value = 'reality'; if (lb) lb.value = 'VLESS-Reality'; autoConfigureServer(); }
      else if (tplId === 'hysteria2') { if (pr) pr.value = 'hysteria2'; if (sc) sc.value = 'tls'; if (lb) lb.value = 'Hysteria2-QUIC'; autoConfigureServer(); }
      else if (tplId === 'awg_srv') { if (pr) pr.value = 'awg'; if (lb) lb.value = 'AmneziaWG-Home'; autoConfigureServer(); }
      else if (tplId === 'tewfai_srv') { if (pr) pr.value = 'tewfai'; if (lb) lb.value = 'TewFai-WebRTC'; autoConfigureServer(); }
      else if (tplId === 'ss2022') { if (pr) pr.value = 'shadowsocks'; if (lb) lb.value = 'SS2022-Server'; autoConfigureServer(); }
      else if (tplId === 'mtproto_srv') { if (pr) pr.value = 'mtproto'; if (lb) lb.value = 'Telegram-MTProto'; autoConfigureServer(); }
    }, 30);
  } else if (kind === 'profile') {
    editProfile();
    setTimeout(() => {
      const lb = document.getElementById('mProfLabel');
      const av = document.getElementById('mProfAvatar');
      const qt = document.getElementById('mProfQuota');
      if (tplId === 'child_safe') { if (lb) lb.value = 'Детский профиль'; if (av) av.value = 'child'; if (qt) qt.value = 120; }
      else if (tplId === 'school_focus') { if (lb) lb.value = 'Школьник'; if (av) av.value = 'student'; if (qt) qt.value = 180; addParentalPresetDomains('gaming'); }
      else if (tplId === 'family_tv') { if (lb) lb.value = 'Семейный Smart TV'; if (av) av.value = 'tv'; if (qt) qt.value = 0; }
    }, 30);
  } else if (kind === 'schedule') {
    editSched();
    setTimeout(() => {
      const lb = document.getElementById('mSchLabel');
      const st = document.getElementById('mSchStart');
      const en = document.getElementById('mSchEnd');
      const ac = document.getElementById('mSchAction');
      if (tplId === 'bedtime') { if (lb) lb.value = 'Ночной отбой'; if (st) st.value = '23:00'; if (en) en.value = '07:00'; if (ac) ac.value = 'block'; }
      else if (tplId === 'homework') { if (lb) lb.value = 'Время учёбы'; if (st) st.value = '15:00'; if (en) en.value = '18:00'; if (ac) ac.value = 'block'; }
      else if (tplId === 'night_route') { if (lb) lb.value = 'Ночной маршрут'; if (st) st.value = '01:00'; if (en) en.value = '08:00'; if (ac) ac.value = 'route'; }
    }, 30);
  }
}

function setSecViewMode(m) {
  S.secViewMode = m;
  localStorage.setItem('tachyon_sec_view', m);
  renderPage();
}

function cloneSec(id) {
  const orig = (S.store.sections || []).find(s => s.id === id);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  const newId = `${orig.id}_copy_${Math.floor(Math.random() * 900 + 100)}`;
  copy.id = newId;
  copy.label = `${orig.label || orig.id} (копия)`;
  const list = [...(S.store.sections || []), copy];
  api('POST', '/api/sections/save', copy).then(() => {
    toast(`Секция «${copy.label}» склонирована`);
    bootstrap();
  }).catch(e => {
    S.store.sections = list;
    toast(`Локальная копия создана: ${e.message}`, true);
    renderPage();
  });
}

    if (deckFilter === 'proxy') return ct === 'proxy' || ct === 'vpn' || ct === 'warp' || ct === 'fptn';
    if (deckFilter === 'desync') return ct === 'desync';
    if (deckFilter === 'direct_block') return ct === 'direct' || ct === 'block' || s.routed_dns_enabled;
    return true;

  const enabledSecs = filteredSecs.filter(s => s.enabled !== false);

    let filteredNodes = cands.filter(n => {
      if (selCC && (n.country || 'UN').toUpperCase() !== selCC) return false;
      if (!filterQ) return true;
      return n.tag.toLowerCase().includes(filterQ) ||
        (n.country || '').toLowerCase().includes(filterQ) ||
        (n.protocol || '').toLowerCase().includes(filterQ);

    return `

        ${COMMUNITY_CATEGORIES.map(cat => `
          <div style="width:100%;font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;margin-top:4px">${esc(cat.group)}</div>
          ${cat.items.map(srv => `
            <label class="chip-option ${selSet.has(srv) ? 'selected' : ''}" data-srv="${esc(srv.toLowerCase())}">
              <input type="checkbox" value="${esc(srv)}" ${selSet.has(srv) ? 'checked' : ''} onchange="this.parentElement.classList.toggle('selected', this.checked)"/>
              <span>${esc(srv)}</span>
            </label>
          `).join('')}
        `).join('')}
      </div>
    </div>
  `;
}

function filterCommPicker(pickerId, q) {
  const query = (q || '').trim().toLowerCase();
  const labels = document.querySelectorAll(`#${pickerId} label.chip-option`);
  labels.forEach(lbl => {
    const s = lbl.getAttribute('data-srv') || '';
    lbl.style.display = (!query || s.includes(query)) ? '' : 'none';
  });
}

function toggleAllCommPicker(pickerId, state) {
  const labels = document.querySelectorAll(`#${pickerId} label.chip-option`);
  labels.forEach(lbl => {
    if (state && lbl.style.display === 'none') return;
    const cb = lbl.querySelector('input[type="checkbox"]');
    if (cb) {
      cb.checked = state;
      lbl.classList.toggle('selected', state);
    }
  });
}

const CLOUDFLARE_SHARED_CIDRS = [
  '104.16.0.0/12', '104.16.0.0/13', '104.24.0.0/14', '172.64.0.0/13',
  '162.158.0.0/15', '162.159.0.0/16', '108.162.192.0/18', '198.41.128.0/17',
  '173.245.48.0/20', '103.21.244.0/22', '103.22.200.0/22', '103.31.4.0/22',
  '141.101.64.0/18', '190.93.240.0/20', '188.114.96.0/20', '197.234.240.0/22'
];

function checkCloudflareSubnetWarning(val, warnElId) {
  const el = document.getElementById(warnElId);
  if (!el) return;
  const lines = splitLines(val || '');
  const matched = lines.filter(l => CLOUDFLARE_SHARED_CIDRS.some(cf => l.startsWith(cf.split('/')[0].slice(0, 7))));
  if (matched.length) {
    el.style.display = 'block';
    el.textContent = `Внимание: подсети ${matched.join(', ')} принадлежат общей Anycast-сети Cloudflare CDN. Маршрутизация или блокировка всей подсети затронет тысячи сторонних сайтов за Cloudflare. Рекомендуется указывать конкретные домены вместо общих CDN-подсетей.`;
  } else {
    el.style.display = 'none';
  }
}

function appendTextareaLine(taId, line) {
  const ta = document.getElementById(taId);
  if (!ta || !line) return;
  const cur = splitLines(ta.value);
  if (!cur.includes(line)) {
    cur.push(line);
    ta.value = cur.join('\n');
  }
}

function sortAndDedupTextarea(taId) {
  const ta = document.getElementById(taId);
  if (!ta) return;
  const lines = Array.from(new Set(splitLines(ta.value))).sort((a, b) => a.localeCompare(b));
  ta.value = lines.join('\n');
  toast(`Отсортировано и очищено от дубликатов (${lines.length} строк)`);
}

function switchSecModalTab(tabId) {
  document.querySelectorAll('[data-sec-tab]').forEach(b => {

  document.querySelectorAll('[data-sec-pane]').forEach(p => {
    p.style.display = p.getAttribute('data-sec-pane') === tabId ? 'flex' : 'none';
  });

  const ct = document.getElementById('mSecConnType')?.value || 'proxy';

function syncLanPickerToTextarea(pickerId, textareaId) {
  const checked = Array.from(document.querySelectorAll(`#${pickerId} input[type="checkbox"]:checked`)).map(i => i.value);
  const ta = document.getElementById(textareaId);
  if (!ta) return;
  const current = splitLines(ta.value);
  const merged = Array.from(new Set([...checked, ...current.filter(ip => !(S.live.lan_devices || []).some(d => d.ip === ip))]));
  ta.value = merged.join('\n');
}

function readCheckedValues(containerId) {
  return Array.from(document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`)).map(el => el.value);
}

async function delSec(id) {
  if (!confirm(`Удалить секцию ${id}?`)) return;
  try {
    await api('POST', '/api/sections/delete', { id });
    toast('Секция удалена');
    await bootstrap();
  } catch (e) {
    toast(e.message, true);
  }
}

async function refreshAllSubs() {
  const subs = (S.store.outbound_sources || []).filter(s => s.enabled !== false && s.source_type === 'subscription');
  if (!subs.length) return toast('Нет активных подписок для обновления', true);
  toast(`Запущено обновление ${subs.length} подписок...`);
  for (const s of subs) {
    try { await api('POST', '/api/sources/refresh', { id: s.id }); } catch (_) {}
  }
  toast('Все подписки обновлены');
  await bootstrap();
}

async function toggleSrcEnabled(id, enabled) {
  const orig = (S.store.outbound_sources || []).find(s => s.id === id);
  if (!orig) return;
  const payload = Object.assign({}, orig, { enabled: !!enabled });
  try {
    await api('POST', '/api/sources/save', payload);
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

async function cloneSrc(id) {
  const orig = (S.store.outbound_sources || []).find(s => s.id === id);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = `${orig.id}_copy_${Math.floor(Math.random() * 900 + 100)}`;
  copy.name = `${orig.name || orig.id} (копия)`;
  try {
    await api('POST', '/api/sources/save', copy);
    toast(`Источник «${copy.name}» склонирован`);
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

function toggleSourceInlineInspector(srcId) {
  if (!S.srcInlineOpen) S.srcInlineOpen = {};
  S.srcInlineOpen[srcId] = !S.srcInlineOpen[srcId];
  renderPage();
}

function vStudioSources(srcs) {
  const secs = S.store.sections || [];
  const grps = S.store.outbound_groups || [];
  const srcFilter = S.srcDeckFilter || 'all';
  const filteredSrcs = srcs.filter(s => {
    const st = (s.source_type || 'subscription').toLowerCase();
    if (srcFilter === 'subscription') return st === 'subscription';
    if (srcFilter === 'proxy_links') return st === 'proxy_links' || st === 'custom_json';
    if (srcFilter === 'tunnels') return ['warp','fptn','awg','wireguard','openvpn','masque','openconnect','tailscale','tor'].includes(st);
    if (srcFilter === 'desync') return st === 'desync';
    return true;
  });
  const enabledSrcs = filteredSrcs.filter(s => s.enabled !== false);
  const disabledSrcs = filteredSrcs.filter(s => s.enabled === false);

  const renderSourceRowHtml = (src) => {
    const nodes = src.cached_nodes || [];
    const countries = Array.from(new Set(nodes.map(n => n.country).filter(Boolean)));
    const usedTraffic = (src.sub_upload_bytes || 0) + (src.sub_download_bytes || 0);
    const totalTraffic = src.sub_total_bytes || 0;
    const quotaPct = totalTraffic > 0 ? Math.min(100, Math.round((usedTraffic / totalTraffic) * 100)) : 0;
    const usedInSecs = secs.filter(sec => (sec.outbound_source_refs || []).includes(src.id));
    const usedInGrps = grps.filter(grp => (grp.primary_refs || []).includes(src.id) || (grp.backup_refs || []).includes(src.id) || (grp.source_refs || []).includes(src.id));
    const isOpen = !!(S.srcInlineOpen && S.srcInlineOpen[src.id]);
    const searchQ = ((S.srcNodeSearch && S.srcNodeSearch[src.id]) || '').toLowerCase().trim();
    const filteredNodes = nodes.filter(n => !searchQ || (n.tag || '').toLowerCase().includes(searchQ) || (n.protocol || '').toLowerCase().includes(searchQ) || (n.country || '').toLowerCase().includes(searchQ));

    return `
      <div class="card card-interactive" style="${src.enabled === false ? 'opacity:0.62' : ''}">
        <div class="card-head" style="flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div style="font-size:14px;font-weight:600;color:var(--text)">${esc(src.name || src.id)} <span class="mono" style="font-size:11px;color:var(--text-3);font-weight:400">(${esc(src.id)})</span></div>
            <span class="badge badge-signal mono">${esc(src.source_type)}</span>
            <span class="badge">${nodes.length} узлов</span>
            ${renderSecPrefixBadge(src, 'source')}
            ${src.desync_preset && src.source_type === 'desync' ? `<span class="badge badge-ok">Desync: ${esc(src.desync_preset)}</span>` : ''}
            ${src.wg_endpoint ? `<span class="badge mono">${esc(src.wg_endpoint)}</span>` : ''}
            ${countries.slice(0, 10).map(c => flagSvg(c)).join('')}
            ${countries.length > 10 ? `<span class="badge">+${countries.length - 10}</span>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <label class="check-row">
              <input type="checkbox" ${src.enabled !== false ? 'checked' : ''} onchange="toggleSrcEnabled('${esc(src.id)}', this.checked)"/>
              <span>Активен</span>
            </label>
            <button class="btn btn-sm ${isOpen ? 'btn-signal' : ''}" onclick="toggleSourceInlineInspector('${esc(src.id)}')">${isOpen ? '▾ Скрыть инспектор' : `▸ Серверы и метаданные (${nodes.length})`}</button>
            ${src.source_type === 'subscription' ? `<button class="btn btn-sm" onclick="refreshSub('${esc(src.id)}')" title="Обновить подписку">${ic('refresh', 12)} Обновить</button>` : ''}
            <button class="btn btn-sm" onclick="cloneSrc('${esc(src.id)}')" title="Дублировать источник">${ic('copy', 12)} Клон</button>
            <button class="btn btn-sm" onclick="editSrc('${esc(src.id)}')">${ic('edit', 12)} Изменить</button>
            <button class="btn btn-sm btn-danger" onclick="delSrc('${esc(src.id)}')">${ic('trash', 12)}</button>
          </div>
        </div>

        <div class="studio-pipeline-box">
          <div class="studio-pipeline-stage">
            <div class="studio-pipeline-stage-label">Параметры источника, квота трафика и фильтры</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
              ${(src.subscription_urls || []).length ? `<span class="badge mono" title="${esc(src.subscription_urls.join(', '))}">URL: ${src.subscription_urls.length} · авто: ${esc(src.subscription_update_interval || '6h')}</span>` : ''}

              ${(totalTraffic > 0 || src.sub_expire_unix) ? `<span class="badge badge-ok mono">Трафик: ${fmtBytes(usedTraffic)}${totalTraffic > 0 ? ` / ${fmtBytes(totalTraffic)} (${quotaPct}%)` : ''}${src.sub_expire_unix ? ` · до ${new Date(src.sub_expire_unix * 1000).toLocaleDateString('ru-RU')}` : ''}</span>` : ''}

  openModal(`Узлы источника: ${src.name || src.id} (${nodes.length})`, `

async function probeSingleNode(tag, cellId) {
  try {
    const r = await api('POST', '/api/nodes/delay', { tag });
    if (r.delay_ms) {
      S.live.node_latencies_ms[tag] = r.delay_ms;
      const el = document.getElementById(cellId);
      if (el) el.textContent = `${r.delay_ms} ms`;
      toast(`Узел ${tag}: ${r.delay_ms} мс`);
    } else {
      toast(`Узел ${tag}: таймаут`, true);
    }
  } catch (e) { toast(e.message, true); }
}

async function probeSingleNodeExit(tag) {
  try {
    const r = await api('POST', '/api/nodes/exit', { tag });
    toast(`Выходной IP узла ${tag}: ${JSON.stringify(r.exit || r)}`);
  } catch (e) { toast(e.message, true); }
}

async function checkTailscaleModal() {
  try {
    const r = await api('GET', '/api/tailscale');
    openModal('Состояние сети Tailscale (tachyon-core)', `
      <textarea readonly style="min-height:220px" class="mono">${esc(JSON.stringify(r, null, 2))}</textarea>
    `);
  } catch (e) { toast(e.message, true); }
}

function insertProtocolTemplate(protoKey) {
  const tpl = OUTBOUND_PROTOCOL_TEMPLATES[protoKey];
  if (!tpl) return;
  if (tpl.startsWith('{')) {
    const cj = document.getElementById('mSrcCustomJson');
    const st = document.getElementById('mSrcType');
    if (cj) cj.value = tpl;
    if (st) st.value = 'custom_json';
    toast(`Шаблон JSON протокола ${protoKey} подставлен в custom_json`);
  } else {
    const ta = document.getElementById('mSrcLinks');
    const st = document.getElementById('mSrcType');
    if (ta) ta.value = (ta.value ? ta.value + '\n' : '') + tpl;
    if (st) st.value = 'proxy_links';
    toast(`Шаблон URI протокола ${protoKey} добавлен в список ключей`);
  }
}

function parseWgConfIntoModal() {
  const txt = prompt('Вставьте содержимое файла WireGuard / AmneziaWG (.conf):');
  if (!txt) return;
  const getVal = (key) => {
    const m = txt.match(new RegExp('^\\s*' + key + '\\s*=\\s*(.+)$', 'mi'));
    return m ? m[1].trim() : '';
  };
  if (getVal('Endpoint')) document.getElementById('mSrcWgEp').value = getVal('Endpoint');
  if (getVal('Address')) document.getElementById('mSrcWgAddr').value = getVal('Address');
  if (getVal('PrivateKey')) document.getElementById('mSrcWgPriv').value = getVal('PrivateKey');
  if (getVal('PublicKey')) document.getElementById('mSrcWgPub').value = getVal('PublicKey');
  if (getVal('PresharedKey')) document.getElementById('mSrcWgPsk').value = getVal('PresharedKey');
  if (getVal('MTU')) document.getElementById('mSrcWgMtu').value = getVal('MTU');
  if (getVal('Jc')) {
    document.getElementById('mSrcType').value = 'awg';
    document.getElementById('mSrcAwgJc').value = getVal('Jc');
    document.getElementById('mSrcAwgJmin').value = getVal('Jmin') || 40;
    document.getElementById('mSrcAwgJmax').value = getVal('Jmax') || 70;
    document.getElementById('mSrcAwgS1').value = getVal('S1') || 0;
    document.getElementById('mSrcAwgS2').value = getVal('S2') || 0;
    if (getVal('S3')) document.getElementById('mSrcAwgS3').value = getVal('S3');
    if (getVal('S4')) document.getElementById('mSrcAwgS4').value = getVal('S4');
    if (getVal('H1')) document.getElementById('mSrcAwgH1').value = getVal('H1');
    if (getVal('H2')) document.getElementById('mSrcAwgH2').value = getVal('H2');
    if (getVal('H3')) document.getElementById('mSrcAwgH3').value = getVal('H3');
    if (getVal('H4')) document.getElementById('mSrcAwgH4').value = getVal('H4');
    if (getVal('I1')) document.getElementById('mSrcAwgI1').value = getVal('I1');
    if (getVal('I2')) document.getElementById('mSrcAwgI2').value = getVal('I2');
  }
  toast('Параметры .conf распознаны');
}

function buildNodeFromVisualForm() {
  const proto = document.getElementById('nbProto')?.value || 'vless';
  const tag = (document.getElementById('nbTag')?.value.trim() || 'Node-1');
  const cc = (document.getElementById('nbCC')?.value.trim() || 'NL').toUpperCase();
  const host = document.getElementById('nbHost')?.value.trim() || '';
  const port = Number(document.getElementById('nbPort')?.value || 443);
  const secret = document.getElementById('nbSecret')?.value.trim() || '00000000-0000-0000-0000-000000000000';
  const sec = document.getElementById('nbSec')?.value || 'reality';
  const flow = document.getElementById('nbFlow')?.value.trim() || '';
  const sni = document.getElementById('nbSni')?.value.trim() || 'www.microsoft.com';
  const fp = document.getElementById('nbFp')?.value || 'chrome';
  const pbk = document.getElementById('nbPbk')?.value.trim() || '';
  const sid = document.getElementById('nbSid')?.value.trim() || '';
  const trp = document.getElementById('nbTr')?.value || 'tcp';
  const path = document.getElementById('nbPath')?.value.trim() || '/';
  if (!host) { toast('Укажите адрес сервера (Host / IP)', true); return; }

  const fullTag = tag.startsWith('[') ? tag : `[${cc}] ${tag}`;
  const cleanHost = String(host || '').trim().replace(/^\[|\]$/g, '');
  const uriHost = fmtUriHost(cleanHost);
  let line = '';
  if (proto === 'vless') {
    const q = new URLSearchParams({ encryption: 'none', security: sec, sni, fp, type: trp });
    if (flow) q.set('flow', flow);
    if (pbk) q.set('pbk', pbk);
    if (sid) q.set('sid', sid);
    if (trp !== 'tcp') q.set('path', path);
    if (trp === 'xhttp') q.set('mode', 'packet-up');
    line = `vless://${encodeURIComponent(secret)}@${uriHost}:${port}?${q.toString()}#${encodeURIComponent(fullTag)}`;
  } else if (proto === 'hysteria2') {
    line = `hysteria2://${encodeURIComponent(secret)}@${uriHost}:${port}?sni=${encodeURIComponent(sni)}#${encodeURIComponent(fullTag)}`;
  } else if (proto === 'tuic') {
    line = `tuic://${encodeURIComponent(secret)}:${encodeURIComponent(secret)}@${uriHost}:${port}?congestion_control=bbr&alpn=h3&sni=${encodeURIComponent(sni)}#${encodeURIComponent(fullTag)}`;
  } else if (proto === 'trojan') {
    line = `trojan://${encodeURIComponent(secret)}@${uriHost}:${port}?security=${sec}&sni=${encodeURIComponent(sni)}&type=${trp}#${encodeURIComponent(fullTag)}`;
  } else if (proto === 'ss') {
    line = `ss://${btoa(`2022-blake3-aes-256-gcm:${secret}`)}@${uriHost}:${port}#${encodeURIComponent(fullTag)}`;
  } else if (proto === 'socks5' || proto === 'http') {
    line = `${proto}://${encodeURIComponent(secret)}@${uriHost}:${port}#${encodeURIComponent(fullTag)}`;
  } else {
    const obj = { type: proto, tag: fullTag, server: cleanHost, server_port: port, uuid: secret, password: secret };
    if (sec !== 'none') obj.tls = { enabled: true, server_name: sni };
    if (proto === 'tewfai') { obj.shaper_profile = 'webrtc_video'; obj.morph_profile = 'chrome_h3'; }
    const cj = document.getElementById('mSrcCustomJson');
    const st = document.getElementById('mSrcType');
    if (cj) cj.value = JSON.stringify(obj);
    if (st) st.value = 'custom_json';
    toast(`Конфигурация ${proto.toUpperCase()} (${fullTag}) собрана в custom_json`);
    return;
  }

  const ta = document.getElementById('mSrcLinks');
  const st = document.getElementById('mSrcType');
  if (ta) ta.value = (ta.value ? ta.value + '\n' : '') + line;
  if (st) st.value = 'proxy_links';
  toast(`Узел ${fullTag} собран и добавлен в список ключей`);
}
