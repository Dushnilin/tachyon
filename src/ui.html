  const orig = (S.store.conditions || []).find(c => c.id === id);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = `${orig.id}_copy_${Math.floor(Math.random() * 900 + 100)}`;
  copy.name = `${orig.name || orig.id} (копия)`;
  try {
    await api('POST', '/api/conditions/save', copy);
    toast(`Условие «${copy.name}» склонировано`);
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

function vStudioConditions(conds) {
  const secs = S.store.sections || [];
  const cFilter = S.condDeckFilter || 'all';
  const filteredConds = conds.filter(c => {
    const used = secs.some(s => (s.condition_refs || []).includes(c.id));
    if (cFilter === 'bound') return used;
    if (cFilter === 'community') return (c.community_lists || []).length > 0;
    if (cFilter === 'domains') return (c.user_domains || []).length > 0 || (c.user_subnets || []).length > 0 || (c.remote_domain_lists || []).length > 0;
    return true;
  });
  const enabledConds = filteredConds.filter(c => c.enabled !== false);
  const disabledConds = filteredConds.filter(c => c.enabled === false);

  // Detect duplicate domains across conditions
  const domOwners = {};
  conds.forEach(c => {
    (c.user_domains || []).forEach(d => {
      const k = d.trim().toLowerCase();
      if (!k) return;
      if (!domOwners[k]) domOwners[k] = [];
      domOwners[k].push(c.id);
    });
  });

  const renderCondCard = (c) => {
    const usedSecs = secs.filter(s => (s.condition_refs || []).includes(c.id));
    const dupDoms = (c.user_domains || []).filter(d => (domOwners[d.trim().toLowerCase()] || []).length > 1);
    return `
      <div class="card card-interactive" style="${c.enabled === false ? 'opacity:0.62' : ''}">
        <div class="card-head" style="flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div style="font-size:14px;font-weight:600;color:var(--text)">${esc(c.name || c.id)} <span class="mono" style="font-size:11px;color:var(--text-3);font-weight:400">(${esc(c.id)})</span></div>
            <span class="badge badge-signal mono">${esc(c.condition_type || 'atomic')}${c.invert ? ' (NOT)' : ''}</span>
            ${dupDoms.length ? `<span class="badge badge-warn" title="Домены дублируются в других условиях: ${esc(dupDoms.join(', '))}">Дубликатов доменов: ${dupDoms.length}</span>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <label class="check-row">
              <input type="checkbox" ${c.enabled !== false ? 'checked' : ''} onchange="toggleCondEnabled('${esc(c.id)}', this.checked)"/>
              <span>Активно</span>
            </label>
            <button class="btn btn-sm" onclick="cloneCond('${esc(c.id)}')">${ic('copy', 12)} Клон</button>
            <button class="btn btn-sm" onclick="editCond('${esc(c.id)}')">${ic('edit', 12)} Изменить</button>
            <button class="btn btn-sm btn-danger" onclick="delCond('${esc(c.id)}')">${ic('trash', 12)}</button>
          </div>
        </div>

        <div class="studio-pipeline-box">
          <div class="studio-pipeline-stage">
            <div class="studio-pipeline-stage-label">Этап 1 · Сводка предикатов правила</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">
              ${c.expression ? `<span class="badge badge-warn mono">expr: ${esc(c.expression)}</span>` : ''}
              ${(c.children || []).map(ch => `<span class="badge badge-warn mono">child: ${esc(ch)}</span>`).join('')}
              ${(c.community_lists || []).map(l => `<span class="badge">${esc(l)}</span>`).join('')}
              ${(c.user_domains || []).length ? `<span class="badge">+${c.user_domains.length} доменов</span>` : ''}
              ${(c.user_subnets || []).length ? `<span class="badge">+${c.user_subnets.length} CIDR</span>` : ''}
              ${(c.remote_domain_lists || []).length ? `<span class="badge mono">${c.remote_domain_lists.length} URL доменов</span>` : ''}
              ${(c.remote_subnet_lists || []).length ? `<span class="badge mono">${c.remote_subnet_lists.length} URL подсетей</span>` : ''}
              ${(c.geoip_codes || []).map(g => `<span class="badge">GeoIP(${esc(c.geoip_mode || 'include')}): ${esc(g)}</span>`).join('')}
              ${(c.geosite_codes || []).map(g => `<span class="badge">GeoSite: ${esc(g)}</span>`).join('')}
              ${(c.client_ips || []).map(ip => `<span class="badge mono">LAN: ${esc(ip)}</span>`).join('')}
              ${(c.ports || []).length ? `<span class="badge mono">Порты: ${esc(c.ports.join(','))}</span>` : ''}
              ${c.l4_proto ? `<span class="badge mono">L4: ${esc(c.l4_proto)}</span>` : ''}
              ${(c.protocol || []).length ? `<span class="badge mono">L7: ${esc(c.protocol.join(','))}</span>` : ''}
              ${c.time_window ? `<span class="badge">${ic('clock', 10)} ${esc(c.time_window)}</span>` : ''}
            </div>
          </div>
          <div class="studio-pipeline-arrow">➔</div>
          <div class="studio-pipeline-stage">
            <div class="studio-pipeline-stage-label">Этап 2 · Используется в секциях маршрутизации</div>
            <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center">
              ${usedSecs.map(s => `<span class="badge badge-signal mono" style="cursor:pointer" onclick="switchStudioTab('sections');setTimeout(()=>editSec('${esc(s.id)}'),40)">${esc(s.label || s.id)}</span>`).join('')}

            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <select onchange="S.condDeckFilter=this.value;renderPage()" style="width:210px;padding:4px 8px;font-size:11.5px">

              <option value="bound" ${cFilter === 'bound' ? 'selected' : ''}>Привязанные к секциям</option>
              <option value="community" ${cFilter === 'community' ? 'selected' : ''}>Списки сервисов</option>
              <option value="domains" ${cFilter === 'domains' ? 'selected' : ''}>Домены и подсети</option>
            </select>
            <button class="btn btn-sm btn-primary" onclick="openStudioCreateModal('condition')">${ic('plus', 13)} Добавить условие</button>
          </div>

        <div style="padding:14px;display:flex;flex-direction:column;gap:10px">
          ${enabledConds.map(c => renderCondCard(c)).join('')}

            <div class="field-label">Порт и запуск</div>

              <input type="number" id="trTargetPort" value="443" class="mono" style="width:84px"/>

        </div>

async function runCondTracer() {
  const client_ip = document.getElementById('trClientIp')?.value || '192.168.1.100';
  const target = document.getElementById('trTargetHost')?.value || 'discord.com';
  const port = Number(document.getElementById('trTargetPort')?.value || 443);
  const box = document.getElementById('trCondOut');
  try {
    const res = await api('POST', '/api/diagnostics/route-explain', { client_ip, target, port, protocol: 'tcp' });
    if (box) {
      box.innerHTML = `Совпавшая секция: <strong style="color:var(--text)">${esc(res.matched_section)}</strong> · Предикат: <strong style="color:var(--text)">${esc(res.reason)}</strong> · Выходной узел: <span class="badge badge-signal">${esc(res.outbound_tag)}</span>`;
    }
  } catch (e) {
    if (box) box.textContent = 'Ошибка: ' + e.message;
  }
}

async function saveCond() {
  const rsList = gl('mCondRuleSet');
  const payload = {
    id: gv('mCondId'),
    enabled: gc('mCondEnabled'),
    name: gv('mCondName'),
    condition_type: gv('mCondType', 'atomic'),
    expression: gv('mCondExpr'),
    invert: gc('mCondInvert'),
    children: readCheckedValues('mCondChildren'),
    community_lists: readCheckedValues('mCondComm'),
    rule_set: rsList,
    domain_ip_lists: rsList,
    user_domains: gl('mCondDomains'),
    user_subnets: gl('mCondSubnets'),
    remote_domain_lists: gl('mCondRemDom'),
    remote_subnet_lists: gl('mCondRemSub'),
    geoip_codes: gl('mCondGeo'),
    geoip_mode: gv('mCondGeoMode', 'include'),
    geosite_codes: gl('mCondGeosite'),
    client_ips: gl('mCondClients'),
    exclude_client_ips: gl('mCondExClients'),
    fully_routed_ips: gl('mCondFullClients'),
    source_macs: gl('mCondMacs'),
    source_inbounds: gl('mCondInbounds'),
    ports: gl('mCondPorts'),
    source_ports: gl('mCondSrcPorts'),
    l4_proto: gv('mCondProto'),
    protocol: gl('mCondL7Proto'),
    dscp: gl('mCondDscp').map(Number).filter(n => !isNaN(n)),
    time_window: gv('mCondTime')
  };
  try {
    await api('POST', '/api/conditions/save', payload);
    closeModal();
    toast('Условие сохранено');
    await bootstrap();
  } catch (e) {
    toast(e.message, true);
  }
}

async function delCond(id) {
  if (!confirm(`Удалить условие ${id}?`)) return;
  try {
    await api('POST', '/api/conditions/delete', { id });
    toast('Условие удалено');
    await bootstrap();
  } catch (e) {
    toast(e.message, true);
  }
}

    const md = (b.mode || 'least_test').toLowerCase();
    const bt = (b.balancer_type || 'urltest').toLowerCase();
    if (bFilter === 'ping') return md === 'least_test' || md === 'stability' || md === 'hedged';
    if (bFilter === 'pool') return ['round_robin','least_load','sticky','weighted','quota','throughput'].includes(md);
    if (bFilter === 'priority') return bt === 'priority' || md === 'priority' || md === 'failover' || md === 'passive';
    return true;
  });
  const enabledBals = filteredBals.filter(b => b.enabled !== false);
  const disabledBals = filteredBals.filter(b => b.enabled === false);

  const renderBalCard = (b) => {
    const usedSecs = secs.filter(s => (s.balancer_refs || []).includes(b.id));
    return `
      <div class="card card-interactive" style="${b.enabled === false ? 'opacity:0.62' : ''}">
        <div class="card-head" style="flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div style="font-size:14px;font-weight:600;color:var(--text)">${esc(b.name || b.id)} <span class="mono" style="font-size:11px;color:var(--text-3);font-weight:400">(${esc(b.id)})</span></div>
            <span class="badge badge-ok mono">${esc(b.mode || 'least_test')}</span>
            <span class="badge mono">${esc(b.balancer_type || 'urltest')}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <label class="check-row">
              <input type="checkbox" ${b.enabled !== false ? 'checked' : ''} onchange="toggleBalEnabled('${esc(b.id)}', this.checked)"/>
              <span>Активен</span>
            </label>
            <button class="btn btn-sm" onclick="openBalancerDetailsModal('${esc(b.id)}')">Статус узлов</button>

async function saveBal() {
  const existing = (S.store.balancers || []).find(b => b.id === gv('mBalId')) || {};
  const urls = gl('mBalUrls');
  const payload = Object.assign({}, existing, {
    id: gv('mBalId'),
    enabled: gc('mBalEnabled'),
    name: gv('mBalName'),
    balancer_type: gv('mBalType', 'urltest'),
    mode: gv('mBalMode', 'least_test'),
    testing_url: gv('mBalUrl', 'https://www.gstatic.com/generate_204'),
    testing_urls: urls,
    health_urls: urls,
    multi_url_strategy: gv('mBalMultiStrategy', 'fastest'),
    check_interval: gn('mBalInt', 180),
    check_interval_jitter: gn('mBalJitter', 15),
    urltest_active_check_interval: gv('mBalUtActInt', '30s'),
    idle_timeout: gv('mBalIdleTimeout', '30m'),
    tolerance: gn('mBalTol', 50),
    quota_mib: gn('mBalQuota', 0),
    active_check_interval: gv('mBalActInt', '30s'),
    check_timeout: gv('mBalChkTimeout', '5s'),
    recovery_check_interval: gv('mBalRecInt', '300s'),
    fastest_check_interval: gv('mBalFastInt', '600s'),
    pick_fastest: gc('mBalPickFast'),
    switch_to_faster_same_priority: gc('mBalSwFast'),
    sticky_hash: gv('mBalSticky', 'src_ip'),
    fallback_section: gv('mBalFallback', '').trim(),
    passive_check: gc('mBalPassive'),
    interrupt_exist_connections: gc('mBalInterrupt')
  });
  try {
    await api('POST', '/api/balancers/save', payload);
    closeModal();
    toast('Балансировщик сохранён');
    await bootstrap();
  } catch (e) {
    toast(e.message, true);
  }
}

}

function toggleInputToken(inputId, token) {
  const el = document.getElementById(inputId);
  if (!el) return;
  const cur = splitLines(el.value);
  const idx = cur.findIndex(x => x.toLowerCase() === token.toLowerCase());
  if (idx >= 0) cur.splice(idx, 1);
  else cur.push(token);
  el.value = cur.join(', ');
}

async function saveGrp() {
  const pri = readCheckedValues('mGrpPri');
  const payload = {
    id: gv('mGrpId'),
    enabled: gc('mGrpEnabled'),
    name: gv('mGrpName'),
    primary_refs: pri,
    source_refs: pri,
    backup_refs: readCheckedValues('mGrpBak'),
    fail_policy: gv('mGrpPolicy', 'last_alive'),
    filter_mode: gv('mGrpFilterMode', 'include'),
    detect_server_country: gc('mGrpDetectCC'),
    include_name_regex: gv('mGrpIncRx'),
    exclude_name_regex: gv('mGrpExcRx'),
    include_prefixes: gl('mGrpIncPref'),
    include_country_flags: gl('mGrpIncFlags'),
    include_protocols: gl('mGrpIncProto'),
    include_transports: gl('mGrpIncTr'),
    include_security_types: gl('mGrpIncSec'),
    include_ports: gl('mGrpIncPorts'),
    include_servers: gl('mGrpIncSrvs'),
    exclude_servers: gl('mGrpExcSrvs'),
    exclude_prefixes: gl('mGrpExcPref'),
    exclude_country_flags: gl('mGrpExcFlags'),
    exclude_protocols: gl('mGrpExcProto'),
    exclude_ports: gl('mGrpExcPorts'),
    exclude_transports: [],
    exclude_security_types: []
  };
  try {
    await api('POST', '/api/groups/save', payload);
    closeModal();
    toast('Группа отказоустойчивости сохранена');
    await bootstrap();
  } catch (e) {
    toast(e.message, true);
  }
}

async function delGrp(id) {
  if (!confirm(`Удалить группу ${id}?`)) return;
  try {
    await api('POST', '/api/groups/delete', { id });
    toast('Группа удалена');
    await bootstrap();
  } catch (e) {
    toast(e.message, true);
  }
}

const INBOUND_PROTOCOLS = [
  'vless','vmess','trojan','shadowsocks','hysteria2','tuic','anytls','shadowtls',

];

async function toggleSrvEnabled(id, enabled) {
  const orig = (S.store.servers || []).find(s => s.id === id);
  if (!orig) return;
  try {
    await api('POST', '/api/servers/save', Object.assign({}, orig, { enabled: !!enabled }));
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

async function cloneSrv(id) {
  const orig = (S.store.servers || []).find(s => s.id === id);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = `${orig.id}_copy_${Math.floor(Math.random() * 900 + 100)}`;
  copy.label = `${orig.label || orig.id} (копия)`;
  copy.listen_port = (Number(orig.listen_port) || 443) + 1;
  try {
    await api('POST', '/api/servers/save', copy);
    toast(`Сервер «${copy.label}» склонирован (порт :${copy.listen_port})`);
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

      <div class="studio-pipeline-box">
        <div class="studio-pipeline-stage">

              <option value="proxy" ${sFilter === 'proxy' ? 'selected' : ''}>SOCKS / HTTP / SS2022 / MTProto</option>
            </select>
            <button class="btn btn-sm" onclick="openSubServerSettingsModal()">${ic('settings', 13)} Настроить подписку (URL / QR)</button>
            <button class="btn btn-sm" onclick="navigator.clipboard.writeText('${esc(subUrl)}');toast('Ссылка единой подписки скопирована')">${ic('link', 13)} /sub/${esc(subTok.slice(0, 8))}</button>
            <button class="btn btn-sm" onclick="openWizardModal()">Мастер настройки</button>

                <span>${S.srvDisabledOpen ? '▾ Скрыть' : '▸ Показать'}</span>
              </div>

                <div style="padding:12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border)">
                  ${disabledSrvs.map(srv => renderSrvCard(srv)).join('')}

              ` : ''}
            </div>
          ` : ''}

      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">${ic('shield', 15)} Защита входящих серверов (Honeypot & Banlist)</div>

          </div>
          <span class="badge ${hpHits.length ? 'badge-warn' : 'badge-ok'}">Срабатываний: ${hpHits.length}</span>
        </div>
        ${hpHits.length ? `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Время</th><th>IP источника</th><th>Порт</th><th>Детали пробы</th></tr></thead>
              <tbody>
                ${hpHits.slice(0, 20).map(h => `<tr><td class="mono">${new Date((h.ts || 0)*1000).toLocaleTimeString('ru-RU')}</td><td class="mono">${esc(h.remote_ip)}</td><td class="mono">${h.port || 443}</td><td>${esc(h.reason || 'probe')}</td></tr>`).join('')}
              </tbody>

        ` : `<div class="field-hint">Подозрительных попыток сканирования входящих портов за текущую сессию не зафиксировано.</div>`}

function regenerateSubServerToken() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let tok = '';
  for (let i = 0; i < 16; i++) tok += chars[Math.floor(Math.random() * chars.length)];
  const tokEl = document.getElementById('mSubSrvTok');
  if (tokEl) tokEl.value = tok;
  const host = gv('mSubSrvHost', location.hostname || '192.168.1.1');
  const scheme = gv('mSubSrvScheme', 'http');
  const port = gn('mSubSrvPort', 1680);
  const full = `${scheme}://${fmtUriHost(host)}:${port}/sub/${tok}`;
  const urlEl = document.getElementById('mSubSrvFullUrl');
  if (urlEl) urlEl.value = full;
  const qrBox = document.getElementById('mSubSrvQrBox');
  if (qrBox) qrBox.innerHTML = QR.toSVG(full, 148);
}

async function saveSubServerSettingsModal() {
  const st = Object.assign({}, S.store.settings || {});
  const en = gc('mSubSrvEn');
  const tok = gv('mSubSrvTok', 'default');
  const fmt = gv('mSubSrvFmt', 'auto');
  st.sub_server_enabled = en;
  st.server_subscription_enabled = en;
  st.sub_server_public_host = gv('mSubSrvHost', location.hostname || '192.168.1.1');
  st.sub_server_scheme = gv('mSubSrvScheme', 'http');
  st.sub_server_port = gn('mSubSrvPort', 1680);
  st.sub_server_token = tok;
  st.server_subscription_token = tok;
  st.sub_server_format = fmt;
  st.server_subscription_format = fmt;
  st.sub_server_include_all = gc('mSubSrvAll');
  st.sub_server_inbound_ids = Array.from(document.querySelectorAll('.mSubSrvItemChk:checked')).map(el => el.value);
  try {
    await api('POST', '/api/settings/save', st);
    closeModal();
    toast('Настройки подписки входящих серверов сохранены');
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

let editingSrvClients = [];

async function autoConfigureServer() {
  const proto = gv('mSrvProto', 'vless');
  toast(`Автоконфигурация параметров и ключей для ${proto.toUpperCase()}...`);
  if (proto === 'vless') {
    document.getElementById('mSrvSec').value = 'reality';
    document.getElementById('mSrvFlow').value = 'xtls-rprx-vision';
    await srvKeygen('reality');
  } else if (proto === 'shadowsocks') {
    document.getElementById('mSrvSsMethod').value = '2022-blake3-aes-256-gcm';
    await srvKeygen('ss2022');
  } else if (proto === 'awg' || proto === 'wireguard') {
    await srvKeygen('wg');
  } else if (proto === 'tailscale') {
    const portEl = document.getElementById('mSrvPort');
    if (portEl) portEl.value = '0';
    const secEl = document.getElementById('mSrvSec');
    if (secEl) secEl.value = 'none';
  } else if (proto === 'hysteria2' || proto === 'tuic' || proto === 'trojan' || proto === 'anytls') {
    document.getElementById('mSrvSec').value = 'tls';
    await srvKeygen('reality');
    await srvKeygen('tls_cert');
  } else {
    await srvKeygen('reality');
  }
}

async function pickBestRealitySni() {
  try {
    toast('Сканирование кандидатов TLS 1.3 SNI...');
    const r = await api('POST', '/api/diagnostics/sni-scan', {});
    const best = (r.candidates || []).find(c => c.suitable);
    if (best && best.domain) {
      const el = document.getElementById('mSrvSni');
      if (el) el.value = best.domain;
      toast(`Выбран лучший SNI: ${best.domain} (${best.latency_ms} мс)`);
    } else {
      toast('Подходящий SNI не найден, оставлен текущий', true);
    }
  } catch (e) { toast(e.message, true); }
}

function renderSrvClientsTable() {
  const box = document.getElementById('mSrvClientsWrap');
  if (!box) return;
  if (!editingSrvClients.length) {
    box.innerHTML = `<div class="field-hint">Используется основная учётная запись сервера. Нажмите «Добавить клиента» для раздельных ключей и лимитов.</div>`;
    return;
  }
  box.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Имя</th><th>UUID / Пароль</th><th>Лимит ГБ</th><th>Активен</th><th></th></tr></thead>
        <tbody>
          ${editingSrvClients.map((cl, idx) => `
            <tr>
              <td><input type="text" value="${esc(cl.name || '')}" oninput="editingSrvClients[${idx}].name=this.value" style="padding:4px 6px"/></td>
              <td><input type="text" value="${esc(cl.uuid || cl.password || '')}" oninput="editingSrvClients[${idx}].uuid=this.value;editingSrvClients[${idx}].password=this.value" class="mono" style="padding:4px 6px"/></td>
              <td><input type="number" value="${Math.round((cl.total_limit_bytes || 0) / 1073741824)}" oninput="editingSrvClients[${idx}].total_limit_bytes=Number(this.value||0)*1073741824" class="mono" style="width:74px;padding:4px 6px"/></td>
              <td><input type="checkbox" ${cl.enabled !== false ? 'checked' : ''} onchange="editingSrvClients[${idx}].enabled=this.checked"/></td>
              <td><button class="btn btn-sm btn-danger" onclick="editingSrvClients.splice(${idx},1);renderSrvClientsTable()">${ic('trash', 11)}</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function addSrvClientRow() {
  try {
    const r = await api('POST', '/api/crypto/keygen', { kind: 'uuid' });
    editingSrvClients.push({
      id: 'cl_' + Math.random().toString(36).slice(2, 6),
      name: 'Client ' + (editingSrvClients.length + 1),
      enabled: true,
      uuid: r.uuid || '',
      password: r.uuid || '',
      total_limit_bytes: 0
    });
    renderSrvClientsTable();
  } catch (e) {
    toast(e.message, true);
  }
}

async function srvKeygen(kind) {
  try {
    const res = await api('POST', '/api/crypto/keygen', { kind });
    if (res.uuid && document.getElementById('mSrvUuid')) document.getElementById('mSrvUuid').value = res.uuid;
    if (res.private_key) {
      if (document.getElementById('mSrvRPriv')) document.getElementById('mSrvRPriv').value = res.private_key;
      if (document.getElementById('mSrvAwgPriv')) document.getElementById('mSrvAwgPriv').value = res.private_key;
    }
    if (res.public_key) {
      if (document.getElementById('mSrvRPub')) document.getElementById('mSrvRPub').value = res.public_key;
      if (document.getElementById('mSrvAwgPub')) document.getElementById('mSrvAwgPub').value = res.public_key;
    }
    if (res.short_id && document.getElementById('mSrvSid')) document.getElementById('mSrvSid').value = res.short_id;
    if (res.key && document.getElementById('mSrvPass')) document.getElementById('mSrvPass').value = res.key;
    if (res.cert_pem && document.getElementById('mSrvCertPem')) document.getElementById('mSrvCertPem').value = res.cert_pem;
    if (res.key_pem && document.getElementById('mSrvKeyPem')) document.getElementById('mSrvKeyPem').value = res.key_pem;
    toast('Криптографические ключи сгенерированы');
  } catch (e) {
    toast(e.message, true);
  }
}

async function saveDeviceMetaAndLimit(ip, mac) {
  const custom_name = document.getElementById('mDevName')?.value.trim() || '';
  const note = document.getElementById('mDevNote')?.value.trim() || '';
  const mbps = Number(document.getElementById('mDevLimMbps')?.value || 0);
  const static_lease = !!document.getElementById('mDevStatic')?.checked;
  const bps = mbps > 0 ? mbps * 125000 : 0;
  try {
    await api('POST', '/api/devices/meta', { key: mac || ip, ip, mac, custom_name, note, static_lease, limit_up_bps: bps, limit_down_bps: bps });
    await api('POST', '/api/devices/limit', { ip, limit_up_bps: bps, limit_down_bps: bps });
    closeModal();
    toast(`Параметры и шейпинг для ${ip} применены`);
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

  if (s.enabled === false) return false;
  const now = new Date();
  const dayNames = ['sun','mon','tue','wed','thu','fri','sat'];
  const curDay = dayNames[now.getDay()];
  const days = (s.days || []).map(d => d.toLowerCase());
  if (days.length && !days.includes(curDay)) return false;
  const toMins = (str) => {
    const [h, m] = (str || '00:00').split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
  };
  const curM = now.getHours() * 60 + now.getMinutes();
  const stM = toMins(s.start_time || '23:00');
  const enM = toMins(s.end_time || '07:00');
  return stM <= enM ? (curM >= stM && curM <= enM) : (curM >= stM || curM <= enM);
}

function vMonitoring() {
  const allConns = S.connections || [];
  const secs = S.store.sections || [];
  const q = (S.monSearch || '').trim().toLowerCase();
  const proto = S.monProto || 'all';
  const srcFilter = S.monSourceFilter || 'all';
  const devFilter = S.monDeviceFilter || 'all';
  const routeFilter = S.monRouteFilter || 'all';
  const viewMode = S.monView || 'all';

  // Unique devices and routes for dropdowns
  const uniqueDevices = Array.from(new Set(allConns.map(c => c.src_ip).filter(Boolean))).sort();
  const uniqueRoutes = Array.from(new Set(allConns.map(c => c.outbound).filter(Boolean))).sort();

  const conns = allConns.filter(c => {
    const net = (c.network || 'tcp').toLowerCase();
    if (proto === 'quic') {
      if (net !== 'udp' || Number(c.dst_port) !== 443) return false;
    } else if (proto !== 'all' && net !== proto) {
      return false;
    }
    if (srcFilter === 'core' && (c.source || '').toLowerCase().includes('conntrack')) return false;
    if (srcFilter === 'conntrack' && !(c.source || '').toLowerCase().includes('conntrack')) return false;
    if (devFilter !== 'all' && c.src_ip !== devFilter) return false;
    if (routeFilter !== 'all' && c.outbound !== routeFilter) return false;
    if (!q) return true;
    const hay = `${c.src_ip || ''} ${c.host || ''} ${c.dst_ip || ''} ${c.outbound || ''} ${c.rule || ''}`.toLowerCase();
    return hay.includes(q);
  });

  // Closed / Flight Recorder entries
  const flightEvents = Array.isArray(S.flightData?.events) ? S.flightData.events : (Array.isArray(S.flightData?.closed) ? S.flightData.closed : []);

  // Aggregation for Top Hosts and Top Clients
  const hostMap = {};
  const clientMap = {};
  conns.forEach(c => {
    const h = c.host || c.dst_ip || 'unknown';
    if (!hostMap[h]) hostMap[h] = { host: h, count: 0, dl: 0, ul: 0, outbound: c.outbound || 'direct' };
    hostMap[h].count += 1;
    hostMap[h].dl += Number(c.download || 0);
    hostMap[h].ul += Number(c.upload || 0);

    const cl = c.src_ip || 'unknown';
    if (!clientMap[cl]) clientMap[cl] = { ip: cl, count: 0, dl: 0, ul: 0 };
    clientMap[cl].count += 1;
    clientMap[cl].dl += Number(c.download || 0);
    clientMap[cl].ul += Number(c.upload || 0);
  });
  const topHosts = Object.values(hostMap).sort((a, b) => (b.dl + b.ul) - (a.dl + a.ul));
  const topClients = Object.values(clientMap).sort((a, b) => (b.dl + b.ul) - (a.dl + a.ul));

  const devMap = {};
  (S.devices || []).forEach(d => { if (d.ip) devMap[d.ip] = d.hostname || d.name || d.ip; });

  return `
    <div class="studio-deck">
      <div class="studio-deck-head">
        <div>
          <div class="studio-deck-title">${ic('activity', 16)} Мониторинг соединений в реальном времени</div>
          <div class="studio-deck-sub">Живая телеметрия активных потоков ядра <code class="mono">tachyon-core</code>, таблицы <code class="mono">nf_conntrack</code> и кольцевого буфера закрытых сессий</div>
        </div>
        <div class="studio-deck-actions">
          <button class="btn btn-sm btn-danger" onclick="closeConn('')">✕ Закрыть все соединения</button>
          <button class="btn btn-sm ${S.monPaused ? 'btn-signal' : ''}" onclick="toggleMonPause()">${S.monPaused ? '▶ Продолжить' : '⏸ Пауза'}</button>
          <button class="btn btn-sm" onclick="S.monPaused=false;loadConnections()">${ic('refresh', 12)} Обновить</button>
        </div>
      </div>

      <!-- Row 1: View Mode Tabs + Source Filter + Protocol Chips -->
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border)">
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <div class="subtabs" style="margin:0">

async function routeHostFromMon(domain, section_id) {
  try {
    await api('POST', '/api/core/route-domain', { domain, section_id });
    toast(`Домен ${domain} направлен в секцию ${section_id}`);
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

async function closeConn(id) {
  try {
    await api('POST', '/api/core/connections/close', { id });
    await loadConnections();
  } catch (e) { toast(e.message, true); }
}

function setDiagTab(t) {
  S.diagTab = t;
  renderPage();
}

function toggleDiagSubCard(id) {
  if (!S.diagExpandedSubs) S.diagExpandedSubs = {};
  S.diagExpandedSubs[id] = !S.diagExpandedSubs[id];
  renderPage();
}

function toggleAllDiagSubCards(expandAll) {
  const subs = (S.doctor && S.doctor.subsystems) || [];
  S.diagExpandedSubs = {};
  subs.forEach(s => {
    const key = s.id || s.title;
    S.diagExpandedSubs[key] = expandAll ? true : (s.status !== 'ok');
  });
  renderPage();
}

function openDiagModalTool(toolKey) {
  S.diagTab = toolKey;
  const titles = {
    unlock: 'Проверка доступности сервисов и платформ',
    leak: 'Тест на утечки IP, DNS, WebRTC STUN и TProxy',
    explainer: 'Объяснение маршрута (Route Explainer)',
    stability: 'Отчёт о стабильности, узлах и переключениях',
    dns: 'Тест скорости резолверов DNS (DoH / DoT / UDP)',
    sni: 'Сканер кандидатов TLS 1.3 SNI для VLESS Reality',
    net: 'Сетевые утилиты (Ping / Traceroute / Nslookup / PCAP)',
    ai: 'ИИ-Доктор v3.0 и база знаний',
    aichat: 'ИИ-Чат ассистент по сетевой диагностике',
    fuzzer: 'Подбор стратегий десинхронизации (Strategy Fuzzer)',
    logs: 'Журнал событий службы и ядра маршрутизации',
    summary: 'Глобальная сводка самодиагностики подсистем'
  };
  const bodyHtml = toolKey === 'unlock' ? vDiagUnlock()
    : toolKey === 'leak' ? vDiagLeak()
    : toolKey === 'explainer' ? vDiagRouteExplainer()
    : toolKey === 'stability' ? vDiagStabilityReport()
    : toolKey === 'dns' ? vDiagDns()
    : toolKey === 'sni' ? vDiagSni()
    : toolKey === 'net' ? vDiagNet()
    : toolKey === 'ai' ? vDiagAi()
    : toolKey === 'aichat' ? vDiagAiChat()
    : toolKey === 'fuzzer' ? vDiagFuzzer()
    : toolKey === 'logs' ? vDiagLogsModal()
    : vDiagGlobalSummary();
  openModal(titles[toolKey] || 'Инструмент диагностики', bodyHtml, `<button class="btn btn-primary" onclick="closeModal()">Закрыть</button>`);
}

async function runDiagRouteExplainer() {
  const host = document.getElementById('diagExpHost')?.value.trim() || 'www.youtube.com';
  const src_ip = document.getElementById('diagExpSrc')?.value.trim() || '192.168.1.10';
  const dst_port = Number(document.getElementById('diagExpPort')?.value || 443);
  S.diagExpHost = host; S.diagExpSrc = src_ip; S.diagExpPort = dst_port;
  try {
    S.diagExplainRes = await api('POST', '/api/conditions/trace', { host, src_ip, dst_port, protocol: 'tcp' });
    if (document.getElementById('modalOverlay')?.classList.contains('open')) openDiagModalTool('explainer');
    else renderPage();
  } catch (e) { toast(e.message, true); }
}

function vDiagAiChat() {
  const hist = S.diagAiChatHistory || [

  return `

        ${hist.map(m => `
          <div style="align-self:${m.role === 'user' ? 'flex-end' : 'flex-start'};max-width:85%;padding:8px 12px;border-radius:var(--radius);background:${m.role === 'user' ? 'var(--accent-dim)' : 'var(--bg-card)'};border:1px solid var(--border);font-size:12.5px">
            <div style="font-size:10.5px;color:var(--text-3);margin-bottom:3px;font-weight:600">${m.role === 'user' ? 'Вы' : 'Tachyon AI Doctor'}</div>

  `;

async function sendDiagAiChat() {
  const inp = document.getElementById('aiChatInput');
  const q = inp ? inp.value.trim() : '';
  if (!q) return;
  if (!S.diagAiChatHistory) S.diagAiChatHistory = [];
  S.diagAiChatHistory.push({ role: 'user', text: q });
  try {
    const res = await api('POST', '/api/diagnostics/ai-doctor', { query: q });
    S.diagAiChatHistory.push({ role: 'assistant', text: res.analysis || res.diagnosis || 'Проверка завершена, критических отклонений не обнаружено.' });
    openDiagModalTool('aichat');
  } catch (e) {
    S.diagAiChatHistory.push({ role: 'assistant', text: `Ошибка запроса: ${e.message}` });
    openDiagModalTool('aichat');
  }
}

async function runAutoDoctorRepair() {
  const subs = (S.doctor && S.doctor.subsystems) || [];
  const broken = subs.filter(s => s.status !== 'ok' && s.fix_id);
  if (broken.length === 0) {
    toast('Все подсистемы здоровы — авто-ремонт не требуется');
    return;
  }
  for (const s of broken) {
    try { await api('POST', '/api/diagnostics/quick-fix', { fix_id: s.fix_id }); } catch (_) {}
  }
  await bootstrap();
  toast(`Авто-ремонт выполнен для ${broken.length} подсистем`);
}

async function runVisualFuzzer() {
  const target = document.getElementById('diagFuzzDom').value.trim() || 'www.youtube.com';
  try {
    toast('Запущен перебор стратегий десинхронизации...');
    S.diagFuzzerRes = await api('POST', '/api/diagnostics/fuzzer', { target });
    if (document.getElementById('modalOverlay')?.classList.contains('open')) openDiagModalTool('fuzzer');
    else renderPage();
    toast('Подбор стратегий завершён');
  } catch (e) { toast(e.message, true); }
}

async function applyFuzzerPreset(params, fake_ttl) {
  const sec = (S.store.sections || []).find(s => s.mode === 'desync' || s.connection_type === 'desync') || (S.store.sections || [])[0];
  if (!sec) { toast('Секция десинхронизации не найдена', true); return; }
  const updated = Object.assign({}, sec, {
    mode: 'desync',
    connection_type: 'desync',
    desync_preset: params,
    desync_params: params,
    desync_fake_ttl: Number(fake_ttl || 5)
  });
  try {
    await api('POST', '/api/sections/save', updated);
    toast(`Стратегия применена в секцию «${sec.label || sec.id}»`);
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

function trTgDiagMsg(raw) {
  const text = String(raw || '').trim();
  if (!text) return tr('ОК', 'OK');
  if (S.lang === 'en') return text;
  const exactMap = {
    'Bot token is configured': 'Токен бота настроен',
    'Bot token is missing': 'Токен бота не указан',
    'Admin Chat IDs configured': 'Chat ID администраторов настроены',
    'No admin_ids configured': 'Не заданы admin_ids',
    'Tachyon Core is running': 'Tachyon Core запущен',
    'Tachyon Core is NOT running — bot cannot route through proxy': 'Tachyon Core НЕ запущен — бот не может маршрутизировать через прокси',
    'Direct WAN route configured (no local proxy port needed)': 'Настроен прямой маршрут WAN (локальный порт прокси не требуется)',
    'Local proxy port is not listening': 'Локальный порт прокси не прослушивается',
    'DNS resolves api.telegram.org': 'DNS разрешает api.telegram.org',
    'DNS cannot resolve api.telegram.org — check DNS settings': 'DNS не может разрешить api.telegram.org — проверьте настройки DNS',
    'Proxy route to Telegram API works': 'Маршрут через прокси к Telegram API работает',
    'Proxy route to Telegram API failed — check proxy outbound config': 'Маршрут через прокси к Telegram API не сработал — проверьте конфигурацию outbound прокси',
    'Direct IPv4 to Telegram API works': 'Прямой доступ IPv4 к Telegram API работает',
    'Direct route to Telegram API works': 'Прямой маршрут к Telegram API работает',
    'Direct route to Telegram API failed': 'Прямой маршрут к Telegram API не сработал',
    'Direct API connection failed': 'Прямое подключение к API не удалось',
    'Cannot reach Telegram API directly': 'Нет прямого доступа к Telegram API',
    'Cannot reach Telegram API directly (IPv4 blocked by ISP?)': 'Нет прямого доступа к Telegram API (IPv4 ограничен провайдером?)',
    'No admin_ids set — cannot send test message': 'admin_ids не заданы — невозможно отправить тестовое сообщение',
    'Test message sent to chat': 'Тестовое сообщение отправлено в чат',
    'Failed to send test message — check admin_ids and bot permissions': 'Не удалось отправить тестовое сообщение — проверьте admin_ids и права бота',
    'OK': 'ОК'
  };
  if (exactMap[text]) return exactMap[text];
  const adminMatch = text.match(/^Admin Chat IDs configured\s*\((.+)\)$/);
  if (adminMatch) return `Chat ID администраторов настроены (${adminMatch[1]})`;
  const portMatch = text.match(/^Proxy port (\d+) is listening$/);
  if (portMatch) return `Порт прокси ${portMatch[1]} прослушивается`;
  const proxyWorkMatch = text.match(/^Proxy route to Telegram API works\s*\((.+)\)$/);
  if (proxyWorkMatch) return `Маршрут через прокси к Telegram API работает (${proxyWorkMatch[1]})`;
  const directWorkMatch = text.match(/^Direct (?:IPv4 )?route to Telegram API works\s*\((.+)\)$/);
  if (directWorkMatch) return `Прямой маршрут к Telegram API работает (${directWorkMatch[1]})`;
  return text;
}

function renderTgDiagHtml(res) {
  if (!res) {
    return `<div style="font-size:12px;color:var(--text-3)">Нажмите «Проверить подключение», чтобы проверить токен бота, список администраторов, локальный порт прокси, DNS и отправку тестового сообщения.</div>`;
  }
  const checks = Array.isArray(res.checks) ? res.checks : [];
  const cleanUser = typeof res.bot_username === 'string' ? res.bot_username.replace(/^@+/, '').trim() : '';
  const overallOk = !!res.ok;
  const runText = res.running ? 'Работает' : 'Остановлен';
  const runCls = res.running ? 'badge-ok' : 'badge-warn';
  return `
    <div style="padding:12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="badge ${overallOk ? 'badge-ok' : 'badge-err'}">${overallOk ? 'Все проверки пройдены' : 'Есть ошибки подключения'}</span>
          ${cleanUser ? `<span class="badge badge-signal mono">@${esc(cleanUser)}</span>` : ''}
          ${res.status !== undefined ? `<span class="badge ${runCls}">${esc(runText)}</span>` : ''}
        </div>
        ${res.proxy_url ? `<span class="mono" style="font-size:11.5px;color:var(--text-3)">Маршрут: ${esc(res.proxy_url)}</span>` : ''}
      </div>
      ${checks.length ? `
        <div style="display:flex;flex-direction:column;gap:6px">
          ${checks.map(c => {
            const ok = !!(c && c.ok);
            const msg = trTgDiagMsg((c && (c.message || c.name)) || 'OK');
            return `
              <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px">
                <span style="display:inline-flex;color:${ok ? '#34d399' : '#f87171'}">${ok ? ic('check', 13) : ic('close', 13)}</span>
                <span style="color:${ok ? 'var(--text)' : '#fca5a5'}">${esc(msg)}</span>
              </div>
            `;
          }).join('')}
        </div>
      ` : res.error ? `<div style="font-size:12px;color:#fca5a5">${esc(res.error)}</div>` : ''}
    </div>
  `;
}

async function saveTelegram() {
  const chatRaw = document.getElementById('tgChats')?.value || '';
  const chatNums = splitLines(chatRaw).map(Number).filter(n => Number.isFinite(n) && n !== 0);
  const base = Object.assign({}, S.store.telegram || {});
  delete base.allowed_chat_ids;
  delete base.admin_id;
  delete base.polling_interval;
  delete base.notify_core_crash;
  delete base.notify_wan_failover;
  delete base.notify_on_core_restart;
  delete base.notify_on_wan_drop;
  const payload = Object.assign(base, {
    enabled: !!document.getElementById('tgEn')?.checked,
    bot_token: document.getElementById('tgTok')?.value.trim() || '',
    admin_ids: chatNums,
    router_name: document.getElementById('tgRouterName')?.value.trim() || '',
    poll_interval: Math.max(1, Number(document.getElementById('tgPollInt')?.value || 5) || 5),
    bot_proxy_section: document.getElementById('tgProxySec')?.value || '',
    language: document.getElementById('tgLang')?.value || 'ru',
    webhook_secret: document.getElementById('tgWebhookSec')?.value.trim() || '',
    quiet_hours_enabled: !!document.getElementById('tgQuietEn')?.checked,
    quiet_hours_start: document.getElementById('tgQuietStart')?.value.trim() || '23:00',
    quiet_hours_end: document.getElementById('tgQuietEnd')?.value.trim() || '07:00',
    notify_crash: !!document.getElementById('tgNotCrash')?.checked,
    notify_restart: !!document.getElementById('tgNotRestart')?.checked,
    notify_server_switch: !!document.getElementById('tgNotSrvSwitch')?.checked,
    notify_subscription: !!document.getElementById('tgNotSub')?.checked,
    notify_cert: !!document.getElementById('tgNotCert')?.checked,
    notify_dns_leak: !!document.getElementById('tgNotDns')?.checked,
    notify_auto_update: !!document.getElementById('tgNotAutoUpd')?.checked,
    notify_honeypot: !!document.getElementById('tgNotHp')?.checked,
    notify_parental: !!document.getElementById('tgNotPar')?.checked
  });
  try { await api('POST', '/api/telegram/save', payload); toast('Настройки Telegram сохранены'); await bootstrap(); } catch (e) { toast(e.message, true); }
}

async function testTelegram() {

async function diagnoseTelegram() {
  const btn = document.getElementById('tgDiagBtn');
  const box = document.getElementById('tgDiagBox');
  if (btn) btn.disabled = true;
  if (box) {
    box.innerHTML = `<div style="padding:12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text-2)">Выполняется диагностика подключения к Telegram Bot API...</div>`;
  }
  try {
    const res = await api('POST', '/api/telegram/diagnose', {});
    S.tgDiag = res;
    if (box) box.innerHTML = renderTgDiagHtml(res);
    toast(res && res.ok ? 'Диагностика Telegram: все проверки пройдены' : 'Диагностика Telegram выявила проблемы', !(res && res.ok));
  } catch (e) {
    S.tgDiag = { ok: false, error: e.message, checks: [] };
    if (box) box.innerHTML = renderTgDiagHtml(S.tgDiag);
    toast(e.message, true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

function switchSettingsSubtab(tab) {

    show_tab_telegram: chk('stShowTg'),

    // 7. Advanced & Security
    log_level: val('stLogLvl', 'warn'),
    qos_priority_engine: val('stQosEng', 'auto'),
    section_failover_threshold: num('stSecFoThr', 3),
    core_config_path: val('stCoreCfgPath', '/etc/tachyon-core/config.json'),
    cache_path: val('stCachePath', '/tmp/tachyon-core/cache.db'),
    warp_proxy_section: val('stWarpSec'),
    lite_mode: chk('stLiteMode'),
    dont_touch_dhcp: chk('stNoDhcp'),
    exclude_ntp: chk('stExclNtp'),
    webrtc_leak_protect: chk('stWebrtc'),
    section_failover_enabled: chk('stSecFoEn'),
    honeypot_enabled: chk('stHoneypotEn'),
    server_subscription_title: val('stSubTitle', 'Tachyon Router'),
    server_subscription_token: val('stSubTok', 'default'),
    server_subscription_host: val('stSubHost'),
    server_subscription_format: val('stSubFmt', 'uri'),
    server_subscription_enabled: chk('stSubEn'),
    new_password: val('stNewPass')
  };
  try {
    await api('POST', '/api/settings/save', payload);
    applyThemeAccent(accent);
    toast('Настройки системы сохранены');
    await bootstrap();
  } catch (e) {
    toast(e.message, true);
  }
}

function openRestoreBackupModal() {
  openModal('Восстановление конфигурации из резервной копии JSON', `
    <div class="field">
      <div class="field-label">Вставьте содержимое файла резервной копии tachyon-backup.json</div>
      <textarea id="mRestoreJson" class="mono" style="min-height:220px" placeholder='{"settings": ...}'></textarea>
    </div>
  `, `<button class="btn" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="submitRestoreBackup()">Восстановить конфигурацию</button>`);
}

async function submitRestoreBackup() {
  const raw = document.getElementById('mRestoreJson').value.trim();
  try {
    const parsed = JSON.parse(raw);
    await api('POST', '/api/restore', parsed);
    closeModal();
    toast('Конфигурация восстановлена из резервной копии');
    await bootstrap();
  } catch (e) {
    toast('Ошибка JSON: ' + e.message, true);
  }
}

async function importLegacyFiles() {
  try {
    const r = await api('POST', '/api/system/import-legacy', {});
    toast(`Импортировано объектов: ${r.imported || 0}`);
    await bootstrap();
  } catch (e) { toast(e.message, true); }
}

async function downloadBackup() {
  try {
    const data = await api('GET', '/api/backup');
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tachyon-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  } catch (e) { toast(e.message, true); }
}

// ============================================================================
// ИНИЦИАЛИЗАЦИЯ И ТЕЛЕМЕТРИЯ
// ============================================================================
async function bootstrap() {
  try {
    const d = await api('GET', '/api/bootstrap');
    if (d.system) S.system = d.system;
    if (d.store) S.store = d.store;
    if (d.live) S.live = d.live;
    if (d.doctor) S.doctor = d.doctor;
    if (d.updates) S.updates = d.updates;
    const savedMode = localStorage.getItem('tachyon_mode');
    if (savedMode === 'simple' || savedMode === 'basic' || savedMode === 'advanced') {
      S.uiMode = normalizeUiMode(savedMode);
    } else if (S.store && S.store.settings && S.store.settings.ui_mode) {
      S.uiMode = normalizeUiMode(S.store.settings.ui_mode);
    } else {
      S.uiMode = 'simple';
    }
    document.body.setAttribute('data-ui-mode', S.uiMode);
    if (S.store && S.store.settings && S.store.settings.theme_accent) {
      applyThemeAccent(S.store.settings.theme_accent);
    } else {
      applyThemeAccent(S.themeAccent);
    }
    renderNav();
    renderTopbar();
    renderPage();
  } catch (e) {
    toast('Ошибка загрузки: ' + e.message, true);
  }
}

async function pollTelemetry() {
  try {
    const d = await api('GET', '/api/telemetry');
    if (d.system) S.system = d.system;
    if (d.live) S.live = d.live;
    renderTopbar();
    if (S.tab === 'dashboard') {
      Chart.draw('tpCanvas', S.live.throughput || []);
    }
  } catch (_) {}
}

window.addEventListener('DOMContentLoaded', () => {
  document.body.setAttribute('data-ui-mode', normalizeUiMode(S.uiMode));
  applyThemeAccent(S.themeAccent);
  bootstrap();
  setInterval(pollTelemetry, 3000);
});
</script>
</body>
